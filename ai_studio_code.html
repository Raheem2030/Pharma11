    /* ==========================================================================
       UI CONTROLLER ENGINE
       ========================================================================== */
    let activeTopicId = LECTURE_DATA.topics[0]?.id || '';
    let currentChartInstance = null;
    let lastScrollY = window.scrollY;

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderLectureMetadata();
      renderDrawerTree();
      renderTopic(activeTopicId);
      setupEventListeners();
      setupHeaderAutoHiding();
    });

    // Theme Switcher Logic
    function initTheme() {
      const savedTheme = localStorage.getItem('app-theme') || 'dark';
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');

      if (savedTheme === 'dark') {
        htmlEl.classList.add('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-400';
      } else {
        htmlEl.classList.remove('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-slate-700';
      }
    }

    function toggleTheme() {
      triggerHaptic();
      const htmlEl = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('app-theme', 'light');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-slate-700';
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('app-theme', 'dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-amber-400';
      }
    }

    // Auto-Hiding Header on Scroll
    function setupHeaderAutoHiding() {
      const header = document.getElementById('main-header');
      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        if (currentScrollY > lastScrollY && currentScrollY > 70) {
          header.classList.add('-translate-y-full');
        } else {
          header.classList.remove('-translate-y-full');
        }
        lastScrollY = currentScrollY;
      });
    }

    // Safe Telegram Haptics
    function triggerHaptic() {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
      } catch (e) {}
    }

    // Inject Metadata
    function renderLectureMetadata() {
      document.getElementById('lecture-title-display').innerText = LECTURE_DATA.title;
      document.getElementById('lecture-subtitle-display').innerText = LECTURE_DATA.subtitle;
      document.getElementById('chapter-tag-display').innerText = LECTURE_DATA.chapterTag;
      document.getElementById('topic-count-display').innerText = `${LECTURE_DATA.topics.length} أقسام`;
    }

    // Drawer Tree Renderer
    function renderDrawerTree() {
      const container = document.getElementById('drawer-tree-container');
      container.innerHTML = '';

      LECTURE_DATA.topics.forEach((topic) => {
        const isLevel2 = topic.level === 2;
        const isLevel3 = topic.level === 3;
        const indentClass = isLevel3 ? 'mr-6' : isLevel2 ? 'mr-3' : 'mr-0';
        
        const btn = document.createElement('button');
        btn.className = `w-full text-right p-3 rounded-xl transition-all flex items-center justify-between text-xs font-cairo font-bold ${indentClass} ${
          topic.id === activeTopicId 
            ? 'bg-violet-600/20 text-violet-500 dark:text-violet-400 border border-violet-500/40 shadow-sm' 
            : 'hover:bg-slate-800/20 dark:hover:bg-slate-800/40 text-slate-400'
        }`;
        
        btn.innerHTML = `
          <span class="truncate ml-2">${topic.title}</span>
          <i class="fa-solid fa-chevron-left text-[10px] opacity-60"></i>
        `;

        btn.onclick = () => {
          triggerHaptic();
          switchTopic(topic.id);
          closeDrawer();
        };

        container.appendChild(btn);
      });
    }

    // Render Active Topic
    function renderTopic(topicId) {
      const topic = LECTURE_DATA.topics.find(t => t.id === topicId);
      if (!topic) return;

      activeTopicId = topicId;
      const viewport = document.getElementById('active-topic-viewport');

      if (currentChartInstance) {
        currentChartInstance.destroy();
        currentChartInstance = null;
      }

      viewport.innerHTML = `
        <div class="rich-card p-6 border-b-2 border-b-violet-500/30">
          <span class="text-[11px] font-bold text-violet-500 dark:text-violet-400 uppercase tracking-wider block mb-1">${topic.subtitle || ''}</span>
          <h2 class="font-cairo font-extrabold text-xl md:text-2xl">${topic.title}</h2>
        </div>
        <div>
          ${topic.content}
        </div>
      `;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(viewport, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ],
            throwOnError: false
          });
        } catch (e) {}
      }

      if (topic.chartConfig && document.getElementById('topicChart')) {
        const ctx = document.getElementById('topicChart').getContext('2d');
        currentChartInstance = new Chart(ctx, topic.chartConfig);
      }

      renderDrawerTree();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTopic(topicId) {
      renderTopic(topicId);
    }

    function openDrawer() {
      triggerHaptic();
      document.getElementById('right-outline-drawer').classList.remove('translate-x-full');
      document.getElementById('drawer-overlay').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('right-outline-drawer').classList.add('translate-x-full');
      document.getElementById('drawer-overlay').classList.add('hidden');
    }

    function setupEventListeners() {
      document.getElementById('drawer-toggle-btn').onclick = openDrawer;
      document.getElementById('close-drawer-btn').onclick = closeDrawer;
      document.getElementById('drawer-overlay').onclick = closeDrawer;
      document.getElementById('theme-toggle-btn').onclick = toggleTheme;

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });
    }
  </script>
