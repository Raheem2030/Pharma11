<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>اختبارات وبطاقات علم الأدوية التجريبي</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Cairo & IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-main: #F1F5F9;
      --bg-subtle: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: rgba(0, 0, 0, 0.08);
      --border-strong: #CBD5E1;
      --box-sub: rgba(226, 232, 240, 0.7);
      --step-bg: #E2E8F0;
      --text-title: #0F172A;
      --text-subtitle: #1E293B;
      --text-body: #334155;
      --text-muted: #475569;
      --accent-violet: #8B5CF6;
      --accent-violet-dark: #5B21B6;
      --accent-cyan: #06B6D4;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --card-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-body);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
      font-weight: 400;
      line-height: 1.65;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
      color: var(--text-title);
      line-height: 1.35;
    }

    .katex {
      direction: ltr;
      unicode-bidi: isolate;
      font-size: 1.02em;
    }

    /* Sticky Mobile & Telegram Friendly Header */
    .top-hud {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.07);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .hud-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      background: rgba(139, 92, 246, 0.12);
      color: var(--accent-violet);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-title);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text span {
      font-size: 0.73rem;
      color: var(--text-muted);
      font-weight: 600;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-subtitle);
    }

    .stat-pill.xp {
      background: rgba(245, 158, 11, 0.13);
      border-color: rgba(245, 158, 11, 0.35);
      color: #B45309;
    }

    .stat-pill.mistakes {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.32);
      color: #BE123C;
      cursor: pointer;
    }

    /* 3-Mode Segmented Selector Grid (Fits 100% on Mobile, Tablet, Desktop & Telegram) */
    .mode-bar-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 12px 10px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .mode-tab {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 8px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-subtitle);
      min-height: 52px;
      text-align: center;
      transition: all 0.18s ease;
    }

    .mode-tab:hover {
      border-color: var(--accent-violet);
    }

    .mode-tab.active {
      background: var(--accent-violet);
      color: #FFFFFF;
      border-color: var(--accent-violet);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.28);
    }

    .mode-tab .tab-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .mode-tab .tab-count {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 0.69rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      color: var(--text-muted);
    }

    .mode-tab.active .tab-count {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    @media (min-width: 600px) {
      .mode-tab {
        flex-direction: row;
        font-size: 0.88rem;
        min-height: 44px;
        padding: 8px 12px;
        gap: 8px;
      }
      .mode-tab .tab-top {
        width: auto;
      }
    }

    /* Main Container */
    .app-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 14px calc(36px + env(safe-area-inset-bottom, 0px));
    }

    /* Topic Header Card */
    .topic-header-card {
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topic-en {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-violet);
      margin-bottom: 2px;
    }

    .topic-ar {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-title);
    }

    /* Academic Card */
    .academic-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
      border-right: 4px solid var(--accent-violet);
    }

    .academic-card.border-violet { border-right-color: var(--accent-violet); }
    .academic-card.border-cyan { border-right-color: var(--accent-cyan); }
    .academic-card.border-amber { border-right-color: var(--accent-amber); }

    .card-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-subtitle);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .icon-violet { color: var(--accent-violet); }
    .icon-cyan { color: var(--accent-cyan); }
    .icon-emerald { color: var(--accent-emerald); }
    .icon-amber { color: var(--accent-amber); }
    .icon-rose { color: var(--accent-rose); }

    .step-box {
      background: var(--step-bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .step-box:last-child {
      margin-bottom: 0;
    }

    .sub-box {
      background: var(--box-sub);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .academic-card {
        padding: 15px;
      }
    }

    .tag-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      margin: 2px;
    }
    .tag-violet { background: rgba(139, 92, 246, 0.12); color: var(--accent-violet-dark); }
    .tag-cyan { background: rgba(6, 182, 212, 0.12); color: #0E7490; }
    .tag-emerald { background: rgba(16, 185, 129, 0.12); color: #047857; }
    .tag-amber { background: rgba(245, 158, 11, 0.14); color: #B45309; }
    .tag-rose { background: rgba(244, 63, 94, 0.12); color: #BE123C; }

    /* Progress Bar & Quick Index Navigator */
    .progress-track {
      width: 100%;
      height: 7px;
      background: var(--step-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .index-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin-bottom: 10px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .idx-dot {
      flex-shrink: 0;
      min-width: 32px;
      height: 32px;
      padding: 0 7px;
      border-radius: 9px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-subtitle);
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .idx-dot.current {
      border-color: var(--accent-violet);
      background: var(--accent-violet);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
    }

    .idx-dot.done-ok {
      border-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.15);
      color: #065F46;
    }

    .idx-dot.done-ok.current {
      background: var(--accent-emerald);
      color: #FFFFFF;
    }

    .idx-dot.done-bad {
      border-color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.14);
      color: #9F1239;
    }

    .idx-dot.done-bad.current {
      background: var(--accent-rose);
      color: #FFFFFF;
    }

    /* Touch-friendly Buttons */
    .btn {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.16s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent-violet); color: #FFFFFF; }
    .btn-cyan { background: var(--accent-cyan); color: #FFFFFF; }
    .btn-emerald { background: var(--accent-emerald); color: #FFFFFF; }
    .btn-amber { background: var(--accent-amber); color: #FFFFFF; }
    .btn-rose { background: var(--accent-rose); color: #FFFFFF; }
    .btn-outline {
      background: var(--bg-subtle);
      color: var(--text-subtitle);
      border-color: var(--border-strong);
    }
    .btn-sm {
      padding: 6px 11px;
      min-height: 36px;
      font-size: 0.79rem;
      border-radius: 9px;
    }

    /* Options & Feedback */
    .option-btn {
      width: 100%;
      min-height: 48px;
      text-align: right;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 9px;
      cursor: pointer;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--text-title);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-violet);
      background: rgba(139, 92, 246, 0.04);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--accent-emerald);
      color: #065F46;
    }

    .option-btn.wrong {
      background: rgba(244, 63, 94, 0.1);
      border-color: var(--accent-rose);
      color: #9F1239;
    }

    .feedback-panel {
      margin-top: 12px;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      font-size: 0.9rem;
    }
    .feedback-panel.success { background: rgba(16, 185, 129, 0.09); border-color: var(--accent-emerald); }
    .feedback-panel.error { background: rgba(244, 63, 94, 0.08); border-color: var(--accent-rose); }
    .feedback-panel.info { background: rgba(6, 182, 212, 0.08); border-color: var(--accent-cyan); }

    ul.styled-list {
      padding-right: 18px;
      margin-top: 6px;
    }
    ul.styled-list li {
      margin-bottom: 5px;
    }

    /* 3D Flashcard — Auto-sizing CSS Grid overlap (no mobile text clipping!) */
    .flashcard-scene {
      perspective: 1100px;
      max-width: 640px;
      margin: 12px auto;
    }

    .flashcard-inner {
      display: grid;
      width: 100%;
      min-height: 220px;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      border: 2px solid var(--border-strong);
      border-radius: 16px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .flashcard-front { border-top: 6px solid var(--accent-violet); }
    .flashcard-back { transform: rotateY(180deg); border-top: 6px solid var(--accent-emerald); background: #FAFFFD; }

    .flash-back-text {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: pre-line;
      text-align: right;
      width: 100%;
      line-height: 1.75;
      color: var(--text-title);
    }

    /* Mistake Drawer Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(28px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.2);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      background: var(--text-title);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-box.show { display: flex; }
  </style>
</head>
<body>

  <!-- TOP MOBILE / TELEGRAM MINI APP HUD -->
  <header class="top-hud">
    <div class="hud-inner">
      <div class="brand-group">
        <div class="brand-icon"><i class="fa-solid fa-flask-vial"></i></div>
        <div class="brand-text">
          <h1>علم الأدوية التجريبي</h1>
          <span id="hud-subtitle">الجلسات 1 • 2 • 3 — د. طلة قنبر</span>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat-pill xp"><i class="fa-solid fa-star"></i> <span id="hud-xp">0</span> XP</div>
        <button class="stat-pill mistakes" onclick="openMistakesModal()" title="بنك الأخطاء للمراجعة">
          <i class="fa-solid fa-rotate-left"></i> <span id="hud-mistakes">0</span>
        </button>
      </div>
    </div>

    <!-- 3 Core Modes Bar -->
    <div class="mode-bar-wrap">
      <div class="mode-grid" id="mode-grid"></div>
    </div>
  </header>

  <main class="app-container">
    <div id="topic-banner" class="topic-header-card"></div>
    <div id="game-stage" class="academic-card border-violet"></div>
  </main>

  <!-- Mistake Review Bottom Sheet -->
  <div id="mistakes-modal" class="modal-backdrop" onclick="if(event.target===this) closeMistakesModal()">
    <div class="modal-sheet">
      <div class="card-title">
        <span><i class="fa-solid fa-brain icon-rose"></i> بنك المراجعة الذكية للأخطاء</span>
        <button class="btn btn-outline btn-sm" onclick="closeMistakesModal()"><i class="fa-solid fa-xmark"></i> إغلاق</button>
      </div>
      <div id="mistakes-list"></div>
    </div>
  </div>

  <div id="toast" class="toast-box"></div>

  <script>
    // ========= 1. TELEGRAM MINI APP & HAPTIC INTEGRATION =========
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    function initTelegramApp() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#FFFFFF');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#F1F5F9');
        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user && user.first_name) {
          document.getElementById('hud-subtitle').textContent = `أهلاً ${user.first_name} • الجلسات 1-2-3`;
        }
        if (tg.BackButton) {
          tg.BackButton.onClick(() => {
            const modal = document.getElementById('mistakes-modal');
            if (modal && modal.classList.contains('open')) {
              closeMistakesModal();
            }
          });
        }
      } catch (e) {}
    }

    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      try {
        if (type === 'success' || type === 'error' || type === 'warning') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred('light');
        }
      } catch (e) {}
    }

    function renderMath(el) {
      if (window.renderMathInElement && el) {
        try {
          window.renderMathInElement(el, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        } catch (e) {}
      }
    }

    // ========= 2. STATE & MISTAKE BANK =========
    const DEFAULT_STATE = {
      xp: 0,
      mistakes: [],
      flashMastered: [],
      quizResults: {}, // { [id]: 'ok' | 'bad' }
      tfResults: {}    // { [id]: 'ok' | 'bad' }
    };

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem('pharma_tma_3modes_v1');
        if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem('pharma_tma_3modes_v1', JSON.stringify(appState));
      } catch (e) {}
      updateHUD();
    }

    function addXP(amount, reason) {
      appState.xp += amount;
      saveState();
      haptic('success');
      showToast(`+${amount} XP — ${reason}`, 'emerald');
    }

    function recordMistake(id, topic, question, correction) {
      haptic('error');
      if (!appState.mistakes.some(m => m.id === id)) {
        appState.mistakes.unshift({ id, topic, question, correction });
        saveState();
      }
    }

    function resolveMistake(id) {
      appState.mistakes = appState.mistakes.filter(m => m.id !== id);
      addXP(10, 'مراجعة وتصحيح المفهوم');
      renderMistakesList();
    }

    function updateHUD() {
      document.getElementById('hud-xp').textContent = appState.xp;
      document.getElementById('hud-mistakes').textContent = appState.mistakes.length;
    }

    let toastTimer = null;
    function showToast(msg, tone = 'violet') {
      const t = document.getElementById('toast');
      const bg = { emerald: '#065F46', amber: '#92400E', rose: '#9F1239', violet: '#0F172A' }[tone] || '#0F172A';
      t.style.background = bg;
      t.innerHTML = `<i class="fa-solid fa-sparkles"></i><span>${msg}</span>`;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function openMistakesModal() {
      haptic('tap');
      renderMistakesList();
      document.getElementById('mistakes-modal').classList.add('open');
      if (tg && tg.BackButton) {
        try { tg.BackButton.show(); } catch (e) {}
      }
    }

    function closeMistakesModal() {
      document.getElementById('mistakes-modal').classList.remove('open');
      if (tg && tg.BackButton) {
        try { tg.BackButton.hide(); } catch (e) {}
      }
    }

    function renderMistakesList() {
      const el = document.getElementById('mistakes-list');
      if (appState.mistakes.length === 0) {
        el.innerHTML = `
          <div class="feedback-panel success" style="text-align:center;">
            <i class="fa-solid fa-circle-check" style="font-size:1.5rem;"></i>
            <p style="margin-top:6px; font-weight:700;">بنك الأخطاء فارغ! جميع إجاباتك ممتازة حتى الآن.</p>
          </div>`;
        return;
      }
      el.innerHTML = appState.mistakes.map((m, idx) => `
        <div class="step-box" style="border-right:4px solid var(--accent-rose);">
          <span class="tag-chip tag-rose">${m.topic}</span>
          <h4 style="margin:6px 0; font-size:0.95rem;">${m.question}</h4>
          <p style="color:#065F46; font-weight:600; font-size:0.86rem; margin-bottom:8px;">
            <i class="fa-solid fa-lightbulb icon-emerald"></i> الصواب: ${m.correction}
          </p>
          <button class="btn btn-emerald btn-sm" data-mid="${idx}" onclick="resolveMistakeByIdx(${idx})">
            <i class="fa-solid fa-check"></i> تمت المراجعة (+10 XP)
          </button>
        </div>
      `).join('');
      renderMath(el);
    }

    function resolveMistakeByIdx(idx) {
      const item = appState.mistakes[idx];
      if (item) resolveMistake(item.id);
    }

      { id: 'f5', session: 1, cat: 'الجلسة 1 • مصادر الأدوية', front: 'المصادر المعدنية والحيوانية والمكروبيولوجية والاصطناعية للأدوية', back: '• معدني: سلفات المغنيزيوم (مسهل حجمي)، بيكربونات الصوديوم (مضاد حموضة/إجهاد حراري)، اليود (معقم جروح)، يودور البوتاسيوم (منفث).\n• حيواني: الجونادوتروبين، ثيروكسين الأغنام، فيتامين A و D من كبد سمك القد.\n• مكروبيولوجي: البنسلين من فطر Penicillium notatum.\n• اصطناعي / DNA مأشوب: مركبات HPLC و GC والأنسولين بتقنية DNA المأشوب.' },
      { id: 'f6', session: 1, cat: 'الجلسة 1 • طرق الإعطاء عند الفئران', front: 'خطوات التزقيم الفموي (Oral Gavage) والتطبيق المهبلي عند الفئران', back: '• التزقيم الفموي: (1) محقن 1 مل بإبرة ذات رأس كروي قياس 22GX1 لمنع تلف المري (2) مسك الفأر بإحكام من الطية الظهرية خلف الرقبة (3) تكوين خط مستقيم بين الفم والمعدة (4) إدخال الإبرة مباشرة للمعدة ودفع الجرعة.\n• التطبيق المهبلي (نادر جداً): إدخال القسطرة المطاطية بعمق $2.5\\text{ cm}$ في مهبل الفأرة.' },

      // --- الجلسة 2 ---
      { id: 'f7', session: 2, cat: 'الجلسة 2 • زوايا الحقن', front: 'زوايا الإبر وطبقات الحقن الخمس (ID, IV, SC, IM, IP)', back: '• في الأدمة (ID): زاوية $10^\\circ - 15^\\circ$ تحت البشرة، حجم $\\approx 0.05\\text{ ml}$ (للحساسية واللقاحات).\n• في الوريد (IV): زاوية $15^\\circ - 25^\\circ$ مع سحب ارتجاعي لظهور قطرات الدم.\n• تحت الجلد (SC): زاوية $45^\\circ$ في طية جلدية بين الجلد والعضلات.\n• في العضل (IM): زاوية عمودية $90^\\circ$، حد أقصى $0.5\\text{ ml}$، مع إلزامية السحب الارتجاعي لعدم وجود دم.\n• في الصفاق (IP): زاوية $45^\\circ$ أسفل يسار البطن بإبرة $27\\text{G} \\times 1/2\\text{ in}$.' },
      { id: 'f8', session: 2, cat: 'الجلسة 2 • الحقن عند الفأر', front: 'شروط الحقن في الصفاق (IP) والعضل (IM) وتحت الجلد (SC) عند الفأر', back: '• الصفاق (IP): الامتصاص = نصف أو ربع الوريدي؛ الناحية اليسرى والجزء السفلي من البطن بإبرة أنسولين $27\\text{G} \\times 1/2\\text{ in}$ ($1.0\\text{ ml}$).\n• العضل (IM): حد أقصى $0.5\\text{ ml}$ في عضلة الفخذ بعيداً عن العظم والعصب الوركي؛ إذا سُحب دم يوقف الإعطاء فوراً وتُحرك الإبرة أو يُعاد الحقن.\n• تحت الجلد (SC): في الطية خلف الرأس عند غياب مساعد، وأبطأ امتصاصاً من IV و IM و IP.' },
      { id: 'f9', session: 2, cat: 'الجلسة 2 • الفأر والأرنب', front: 'الحقن الوريدي والقسطرة المعدية عند الفأر والأرنب البالغ', back: '• الفأر (IV): 4 أوردة ذيلية، حمام مائي $45 - 50^\\circ\\text{C}$، الحقن أبعد ما يمكن عن قاعدة الذيل لإتاحة تكرار الحقن.\n• الأرنب (IV): الوريد الأذني الأنسي على الحافة (تجنب الشريان المركزي) بعد إزالة الوبر وفرك الأذن وضغط القاعدة.\n• الأرنب (قسطرة معدية): إدخال القسطرة المطاطية المزلقة عبر الفتحة الخشبية أو البلاستيكية خلف الأسنان الأمامية.\n• تحذير: حقن الأمينوفللين بسرعة وريدياً يسبب خطورة أو موتاً.' },
      { id: 'f10', session: 2, cat: 'الجلسة 2 • حيوانات التجارب', front: 'التشريح المميز للجرذان والفئران في التجارب الدوائية', back: '• تشابه مورثي $85\\%$ مع الإنسان (الفئران).\n• انعدام مركز التقيؤ.\n• انعدام اللوزات والحوصلة الإفرازية.\n• معثكلة منتشرة.\n• معدة مقسمة إلى جزأين: علوي غير غدي وسفلي غدي.' },
      { id: 'f11', session: 2, cat: 'الجلسة 2 • حيوانات التجارب', front: 'ميزات الأرانب وخنازير غينيا والكلاب والضفادع', back: '• الأرانب: تمتلك أنزيم الأتروبيناز، وتحدث الإباضة بعد 10 ساعات من الجماع بتحرر هرمون L.H.\n• خنازير غينيا: الربو والتحسس والهيستامين وحقن جرثومة السل.\n• الكلاب: أنبوب هضمي قصير وألياف بركينجي القلبية.\n• الضفادع: دراسات CNS والقلب والاتصالات العصبية العضلية.' },
      { id: 'f12', session: 2, cat: 'الجلسة 2 • تطوير الدواء', front: 'المراحل الأربع لدراسة الدواء تجريبياً ومدة رخصة التداول', back: '1. المرحلة الصيدلانية (الكيمياوية الفيزيائية): تحرير العنصر الفعال ودراسة هيكله ونقاوته وثباته وانحلاله.\n2. المرحلة التجريبية في الحيوان: خلايا معزولة ثم عضو معزول ثم حيوان حي، وسمية حادة ومزمنة على نوعين.\n3. المرحلة السريرية في الإنسان: متطوع سليم ثم مريض بعد ثبات التحمل والفعالية بالحيوان.\n4. المرحلة الإحصائية: تقييم اللجان الرسمية ومنح رخصة الصرف ($3 - 5$ سنوات) مع إعادة الدراسة دورياً.' },
      { id: 'f13', session: 2, cat: 'الجلسة 2 • الحسابات الصيدلانية', front: 'قوانين حساب الجرعة الدوائية والحجم المطلوب ($\\text{cm}^3$) مع مثال المحاضرة', back: '• تحويل الوزن: $\\text{Weight}_{\\text{kg}} = \\frac{\\text{Weight}_{\\text{g}}}{1000}$\n• التركيز في $100\\text{ cm}^3$: $\\text{Conc}_{100} = \\text{Percent}(\\%) \\times 1000\\text{ mg}$\n• الجرعة الكلية: $\\text{Dose (mg)} = \\text{Weight (kg)} \\times \\text{Dose (mg/kg)}$\n• الحجم: $\\text{Volume (cm}^3\\text{)} = \\frac{\\text{Dose (mg)} \\times 100}{\\text{Conc}_{100}}$\n• مثال الطفل ($20\\text{ kg}$، جرعة $5\\text{ mg/kg}$، محلول $2\\%$): الجرعة $= 100\\text{ mg}$، التركيز $= 2000\\text{ mg}/100\\text{ cm}^3$، الحجم $= 5\\text{ cm}^3$.' },

      // --- الجلسة 3 ---
      { id: 'f14', session: 3, cat: 'الجلسة 3 • السمية والجرعات', front: 'الفرق بين $M.L.D$ و $L.D.0$ و $L.D.50$ و $L.D.100$', back: '• $M.L.D$ (الجرعة القاتلة الصغرى): الجرعة التي تقتل حيواناً واحداً على الأكثر.\n• $L.D.0$ (الجرعة غير القاتلة): أعلى جرعة سامة لا تقتل أي حيوان.\n• $L.D.50$ (الجرعة القاتلة الوسطى): الجرعة التي تقتل $50\\%$ من حيوانات التجربة.\n• $L.D.100$ (الجرعة القاتلة العظمى): أصغر جرعة سامة تقتل كل حيوانات التجربة.' },
      { id: 'f15', session: 3, cat: 'الجلسة 3 • المؤشر العلاجي', front: 'قانون المؤشر العلاجي ($T.I$) ومقارنة الأمان الدوائي', back: '• القانون: $T.I = \\frac{L.D.50}{E.D.50}$\n• الدلالة: كلما ارتفعت قيمة $T.I$ كان الدواء أكثر أماناً وهامش سلامته أوسع.\n• أمثلة: السلفا والبنسلينات ذات مؤشر علاجي مرتفع ومستوى سلامة كبير، بينما مركبات الديجتالين ذات مؤشر علاجي منخفض وهامش أمان أضيق.' },
      { id: 'f16', session: 3, cat: 'الجلسة 3 • اليود ومضادات الجراثيم', front: 'الطيف الجرثومي لليود والاستثناء الوحيد منه', back: '• يشمل طيف اليود الواسع: الجراثيم إيجابية وسلبية الغرام، الفطور، الفيروسات، الطفيليات، الأميبا، والجيارديا.\n• الاستثناء الوحيد: ليس لليود أي تأثير على عصيات السل (T.B).' },
      { id: 'f17', session: 3, cat: 'الجلسة 3 • اليود المشع', front: 'المقارنة بين اليود المشع 131 واليود المشع 123', back: '• اليود المشع 131: نصف عمره البيولوجي $8$ أيام، تنطلق منه أشعة غاما وبيتا، وينطرح $>99\\%$ منه خلال $56$ يوماً ($7 \\times 8$).\n• اليود المشع 123: نصف عمره البيولوجي $13$ يوماً، وتنطلق منه أشعة غاما فقط.' },
      { id: 'f18', session: 3, cat: 'الجلسة 3 • مستحضرات اليود', front: 'مستحضرات اليود الستة وتراكيزها واستعمالاتها', back: '• صبغة اليود (الجلد): $40\\text{ مغ} / 1\\text{ مل}$.\n• يود الغليسرين (جوف الفم): $15\\text{ مغ} / 1\\text{ مل}$.\n• بوفيدون أيودين (الجروح والحروق): $10\\text{ مغ} / 1\\text{ مل}$.\n• أميودارون (مضاد اضطراب نظم الصف III): $75\\text{ ملغ} / \\text{القرص}$.\n• أيودوكسي يوريدين (العين): $18\\text{ ملغ} / \\text{القطرة}$.\n• يود البوتاسيوم (مقشع): $300\\text{ ملغ} / \\text{كل 6 ساعات}$.' },
      { id: 'f19', session: 3, cat: 'الجلسة 3 • الحاجة اليومية والمحاذير', front: 'الحاجة اليومية لليود ومحاذير استعمال يودور البوتاسيوم', back: '• الحاجة اليومية: بعد البلوغ $150\\text{ مغ/يوم}$، الحمل ($+25$) $= 175\\text{ مغ/يوم}$، الإرضاع ($+25$) $= 200\\text{ مغ/يوم}$.\n• محاذير يودور البوتاسيوم: يُمنع استعماله في التهاب القصبات الحاد (بسبب تأثيره المخرش) ويُقتصر على الحالات المزمنة والسعال الجاف.' },
      { id: 'f20', session: 3, cat: 'الجلسة 3 • تجربة اللعاب العملية', front: 'خطوات وكواشف تجربة الكشف عن يودور البوتاسيوم في اللعاب', back: '1. الكشف المسبق في لعاب الطالب قبل التجربة (شاهد لإثبات خلو اللعاب من KI).\n2. شرب كوب يحوي $100\\text{ ml}$ ماء مذاب به $0.5\\text{ g}$ يودور البوتاسيوم.\n3. الكشف بفاصل كل 20 دقيقة لمدة ساعة بترطيب ورقة الترشيح باللعاب.\n4. إضافة الكواشف بالترتيب: $1$ قطرة حمض الكبريت + $1$ قطرة نشاء $1\\%$ + $2$ قطرة ماء أوكسجيني $3\\%$.\n5. الانتظار نصف دقيقة (30 ثانية) وملاحظة تشكل اللون البنفسجي أو الأزرق.' },
      { id: 'f21', session: 3, cat: 'الجلسة 3 • نتائج تجربة اللعاب', front: 'الجدول الزمني لنتائج كشف يودور البوتاسيوم في اللعاب (0، 20، 40، 60 دقيقة)', back: '• قبل الإعطاء (0 دقيقة - الشاهد): سلبي (عديم اللون — إثبات خلو اللعاب من KI).\n• بعد 20 دقيقة: إيجابي (لون بنفسجي / أزرق خفيف — بداية الإطراح اللعابي).\n• بعد 40 دقيقة: إيجابي (لون أزرق بنفسجي واضح وقوي).\n• بعد 60 دقيقة: إيجابي (لون بنفسجي أزرق داكن وكثيف).' }
    ];

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;

      `;

      const activeDot = document.querySelector('#tf-idx-strip .idx-dot.current');
      if (activeDot && activeDot.scrollIntoView) {
        activeDot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function setTFFilter(f) { haptic('tap'); tfFilter = f; tfIdx = 0; tfStep = 'initial'; tfUserChoice = null; tfCorrectionChoice = null; renderStage(); }
    function jumpTF(i) { haptic('tap'); tfIdx = i; tfStep = 'initial'; tfUserChoice = null; tfCorrectionChoice = null; renderStage(); }
    function shuffleTF() { haptic('tap'); TF_DATA = shuffleArray(TF_DATA); tfIdx = 0; tfStep = 'initial'; tfUserChoice = null; tfCorrectionChoice = null; showToast('تم خلط أسئلة الصح والخطأ', 'violet'); renderStage(); }
    function answerTF(choice) {
      const item = getFilteredTF()[tfIdx];
      tfUserChoice = choice;
      if (item.isTrue) {
        tfStep = 'done';
        if (choice) {
          appState.tfResults[item.id] = 'ok';
          addXP(15, 'تقييم صواب دقيق');
        } else {
          appState.tfResults[item.id] = 'bad';
          recordMistake(item.id, `صح وخطأ • الجلسة ${item.session}`, item.statement, item.explain);
        }
      } else {
        if (choice) {
          appState.tfResults[item.id] = 'bad';
          recordMistake(item.id, `صح وخطأ • الجلسة ${item.session}`, item.statement, item.correctionOptions[item.correctIdx]);
        }
        tfStep = 'needsCorrection';
      }
      renderStage();
    }
    function submitTFCorrection(i) {
      const item = getFilteredTF()[tfIdx];
      tfCorrectionChoice = i;
      tfStep = 'done';
      if (tfUserChoice === false && i === item.correctIdx) {
        appState.tfResults[item.id] = 'ok';
        addXP(20, 'كشف الخطأ وتصحيحه');
      } else {
        appState.tfResults[item.id] = 'bad';
        recordMistake(item.id, `صح وخطأ • الجلسة ${item.session}`, item.statement, item.correctionOptions[item.correctIdx]);
      }
      renderStage();
    }
    function nextTF() { const l = getFilteredTF(); tfIdx = (tfIdx + 1) % l.length; tfStep = 'initial'; tfUserChoice = null; tfCorrectionChoice = null; renderStage(); }
    function prevTF() { const l = getFilteredTF(); tfIdx = (tfIdx - 1 + l.length) % l.length; tfStep = 'initial'; tfUserChoice = null; tfCorrectionChoice = null; renderStage(); }

    // ========= INITIALIZATION =========
    document.addEventListener('DOMContentLoaded', () => {
      initTelegramApp();
      updateHUD();
      renderModeBar();
      renderStage();
    });
  </script>
</body>
</html>
