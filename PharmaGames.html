<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ألعاب واختبارات علم الأدوية التجريبي</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Cairo & IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    :root {
      --bg-main: #F1F5F9;
      --bg-subtle: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: rgba(0, 0, 0, 0.08);
      --border-strong: #CBD5E1;
      --box-sub: rgba(226, 232, 240, 0.7);
      --step-bg: #E2E8F0;
      --text-title: #0F172A;
      --text-subtitle: #1E293B;
      --text-body: #334155;
      --text-muted: #475569;
      --accent-violet: #8B5CF6;
      --accent-violet-dark: #5B21B6;
      --accent-cyan: #06B6D4;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --card-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-body);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
      font-weight: 400;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
      color: var(--text-title);
      line-height: 1.35;
    }

    /* Sticky Mobile-Friendly Header */
    .top-hud {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.07);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .hud-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      background: rgba(139, 92, 246, 0.12);
      color: var(--accent-violet);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--text-title);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text span {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-subtitle);
    }

    .stat-pill.xp {
      background: rgba(245, 158, 11, 0.13);
      border-color: rgba(245, 158, 11, 0.35);
      color: #B45309;
    }

    .stat-pill.mistakes {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.32);
      color: #BE123C;
      cursor: pointer;
    }

    /* Horizontal Scrollable Game Selector Strip (Great on Mobile & Telegram) */
    .game-strip-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 12px 10px;
    }

    .game-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 2px 4px;
    }

    .game-strip::-webkit-scrollbar {
      display: none;
    }

    .game-pill {
      scroll-snap-align: start;
      flex-shrink: 0;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 8px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--text-subtitle);
      min-height: 40px;
      transition: all 0.18s ease;
    }

    .game-pill:hover {
      border-color: var(--accent-violet);
    }

    .game-pill.active {
      background: var(--accent-violet);
      color: #FFFFFF;
      border-color: var(--accent-violet);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.28);
    }

    /* Main Container */
    .app-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px calc(36px + env(safe-area-inset-bottom, 0px));
    }

    /* Topic Header Card (from to PDF.md) */
    .topic-header-card {
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topic-en {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-violet);
      margin-bottom: 2px;
    }

    .topic-ar {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-title);
    }

    /* Academic Card (from to PDF.md) */
    .academic-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
      border-right: 4px solid var(--accent-violet);
    }

    .academic-card.border-violet { border-right-color: var(--accent-violet); }
    .academic-card.border-cyan { border-right-color: var(--accent-cyan); }
    .academic-card.border-emerald { border-right-color: var(--accent-emerald); }
    .academic-card.border-amber { border-right-color: var(--accent-amber); }
    .academic-card.border-rose { border-right-color: var(--accent-rose); }

    .card-title {
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--text-subtitle);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .icon-violet { color: var(--accent-violet); }
    .icon-cyan { color: var(--accent-cyan); }
    .icon-emerald { color: var(--accent-emerald); }
    .icon-amber { color: var(--accent-amber); }
    .icon-rose { color: var(--accent-rose); }

    .step-box {
      background: var(--step-bg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .step-box:last-child {
      margin-bottom: 0;
    }

    .step-title {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .sub-box {
      background: var(--box-sub);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .formula-box {
      background: var(--box-sub);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
      direction: ltr;
      text-align: center;
      color: var(--accent-violet-dark);
      font-weight: 700;
      font-size: 0.98rem;
      overflow-x: auto;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 680px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .academic-card {
        padding: 15px;
      }
    }

    .tag-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin: 2px;
    }
    .tag-violet { background: rgba(139, 92, 246, 0.12); color: var(--accent-violet-dark); }
    .tag-cyan { background: rgba(6, 182, 212, 0.12); color: #0E7490; }
    .tag-emerald { background: rgba(16, 185, 129, 0.12); color: #047857; }
    .tag-amber { background: rgba(245, 158, 11, 0.14); color: #B45309; }
    .tag-rose { background: rgba(244, 63, 94, 0.12); color: #BE123C; }

    /* Touch-friendly Buttons (min-height 44px on primary controls) */
    .btn {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.16s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent-violet); color: #FFFFFF; }
    .btn-cyan { background: var(--accent-cyan); color: #FFFFFF; }
    .btn-emerald { background: var(--accent-emerald); color: #FFFFFF; }
    .btn-amber { background: var(--accent-amber); color: #FFFFFF; }
    .btn-rose { background: var(--accent-rose); color: #FFFFFF; }
    .btn-outline {
      background: var(--bg-subtle);
      color: var(--text-subtitle);
      border-color: var(--border-strong);
    }
    .btn-sm {
      padding: 6px 12px;
      min-height: 36px;
      font-size: 0.8rem;
      border-radius: 9px;
    }

    /* Options & Feedback */
    .option-btn {
      width: 100%;
      min-height: 48px;
      text-align: right;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 9px;
      cursor: pointer;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--text-title);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.15s;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--accent-emerald);
      color: #065F46;
    }

    .option-btn.wrong {
      background: rgba(244, 63, 94, 0.1);
      border-color: var(--accent-rose);
      color: #9F1239;
    }

    .feedback-panel {
      margin-top: 12px;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      font-size: 0.9rem;
    }
    .feedback-panel.success { background: rgba(16, 185, 129, 0.09); border-color: var(--accent-emerald); }
    .feedback-panel.error { background: rgba(244, 63, 94, 0.08); border-color: var(--accent-rose); }
    .feedback-panel.info { background: rgba(6, 182, 212, 0.08); border-color: var(--accent-cyan); }

    ul.styled-list {
      padding-right: 18px;
      margin-top: 6px;
    }
    ul.styled-list li {
      margin-bottom: 5px;
    }

    /* 3D Flashcard */
    .flashcard-scene {
      perspective: 1100px;
      max-width: 600px;
      margin: 12px auto;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      min-height: 220px;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--card-bg);
      border: 2px solid var(--border-strong);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--card-shadow);
      overflow-y: auto;
    }

    .flashcard-front { border-top: 6px solid var(--accent-violet); }
    .flashcard-back { transform: rotateY(180deg); border-top: 6px solid var(--accent-emerald); background: #FAFFFD; }

    /* Drag & Drop + Tap-to-Place */
    .dnd-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 60px;
      padding: 12px;
      background: var(--box-sub);
      border: 1.5px dashed var(--border-strong);
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .dnd-chip {
      background: var(--card-bg);
      border: 1.5px solid var(--accent-violet);
      color: var(--text-title);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .dnd-chip.selected {
      background: var(--accent-violet);
      color: #FFFFFF;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .dnd-buckets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .dnd-bucket {
      background: var(--bg-subtle);
      border: 2px dashed var(--border-strong);
      border-radius: 14px;
      padding: 12px;
      min-height: 120px;
      cursor: pointer;
    }

    .dnd-bucket.drag-over {
      border-color: var(--accent-violet);
      background: rgba(139, 92, 246, 0.08);
    }

    .dnd-bucket-title {
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-strong);
    }

    .dnd-placed-item {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--accent-emerald);
      color: #065F46;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    /* Step Order */
    .step-order-item {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .step-order-item.is-correct { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.1); }
    .step-order-item.is-wrong { border-color: var(--accent-rose); background: rgba(244, 63, 94, 0.08); }

    /* Match Pair */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .match-grid { grid-template-columns: 1fr; }
    }
    .match-card {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.86rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .match-card.selected { border-color: var(--accent-violet); background: rgba(139, 92, 246, 0.12); color: var(--accent-violet-dark); }
    .match-card.matched { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.12); color: #065F46; cursor: default; }

    /* Inputs & Tables */
    .calc-input {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-strong);
      background: #FFFFFF;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-title);
      direction: ltr;
      text-align: center;
    }
    .calc-input:focus { outline: none; border-color: var(--accent-violet); }

    input[type="range"].styled-slider {
      width: 100%;
      height: 32px;
      accent-color: var(--accent-violet);
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
    }

    table.academic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      background: var(--card-bg);
    }
    table.academic-table th {
      background: var(--step-bg);
      color: var(--text-title);
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      padding: 10px;
      text-align: right;
      border-bottom: 2px solid var(--border-strong);
    }
    table.academic-table td {
      padding: 9px 10px;
      border-bottom: 1px solid #E2E8F0;
    }

    /* Colorimetric Filter Paper */
    .filter-paper-disc {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      margin: 0 auto;
      background: #F8FAFC;
      border: 3px solid #CBD5E1;
      box-shadow: inset 0 2px 12px rgba(15, 23, 42, 0.08), 0 6px 16px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .filter-stain {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      transition: all 0.5s ease;
      filter: blur(4px);
    }

    /* SVG Hotspot */
    .hotspot-node { cursor: pointer; }

    /* Mistake Drawer Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 28px;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.2);
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      background: var(--text-title);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-box.show { display: flex; }
  </style>
</head>
<body>

  <!-- TOP MOBILE / TELEGRAM MINI APP HUD -->
  <header class="top-hud">
    <div class="hud-inner">
      <div class="brand-group">
        <div class="brand-icon"><i class="fa-solid fa-flask-vial"></i></div>
        <div class="brand-text">
          <h1>ألعاب علم الأدوية التجريبي</h1>
          <span id="hud-subtitle">الجلسات 1 • 2 • 3 — د. طلة قنبر</span>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat-pill xp"><i class="fa-solid fa-star"></i> <span id="hud-xp">0</span> XP</div>
        <button class="stat-pill mistakes" onclick="openMistakesModal()">
          <i class="fa-solid fa-rotate-left"></i> <span id="hud-mistakes">0</span>
        </button>
      </div>
    </div>

    <!-- Scrollable 10-Game Selector Bar -->
    <div class="game-strip-wrap">
      <div class="game-strip" id="game-strip"></div>
    </div>
  </header>

  <main class="app-container">
    <div id="topic-banner" class="topic-header-card"></div>
    <div id="game-stage" class="academic-card border-violet"></div>
  </main>

  <!-- Mistake Review Bottom Sheet -->
  <div id="mistakes-modal" class="modal-backdrop" onclick="if(event.target===this) closeMistakesModal()">
    <div class="modal-sheet">
      <div class="card-title">
        <span><i class="fa-solid fa-brain icon-rose"></i> بنك المراجعة الذكية للأخطاء</span>

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user && user.first_name) {
          document.getElementById('hud-subtitle').textContent = `أهلاً ${user.first_name} • الجلسات 1-2-3`;
        }
      } catch (e) {}
    }

    function haptic(type) {
      if (!tg || !tg.HapticFeedback) return;
      try {
        if (type === 'success' || type === 'error' || type === 'warning') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred('light');
        }
      } catch (e) {}
    }

      xp: 0,
      mistakes: [],
      flashMastered: []

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem('pharma_tma_state_v2');
        if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem('pharma_tma_state_v2', JSON.stringify(appState));
      } catch (e) {}
      updateHUD();
    }

    function addXP(amount, reason) {
      appState.xp += amount;
      saveState();
      haptic('success');
      showToast(`+${amount} XP — ${reason}`, 'emerald');
    }

    function recordMistake(id, topic, question, correction) {
      haptic('error');
      if (!appState.mistakes.some(m => m.id === id)) {
        appState.mistakes.unshift({ id, topic, question, correction });
        saveState();
      }
    }

    function resolveMistake(id) {
      appState.mistakes = appState.mistakes.filter(m => m.id !== id);
      addXP(10, 'مراجعة وتصحيح المفهوم');
      renderMistakesList();
    }

    function updateHUD() {
      document.getElementById('hud-xp').textContent = appState.xp;
      document.getElementById('hud-mistakes').textContent = appState.mistakes.length;

      const t = document.getElementById('toast');
      const bg = { emerald: '#065F46', amber: '#92400E', rose: '#9F1239', violet: '#0F172A' }[tone] || '#0F172A';
      t.style.background = bg;
      t.innerHTML = `<i class="fa-solid fa-sparkles"></i><span>${msg}</span>`;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

      haptic('tap');
      renderMistakesList();
      document.getElementById('mistakes-modal').classList.add('open');

    // ========= 4. NAVIGATION & RENDER CONTROLLER =========
    let activeGameCode = 'QUIZ';

    function renderGameStrip() {
      const strip = document.getElementById('game-strip');
      strip.innerHTML = GAME_CATALOG.map(g => `
        <button class="game-pill ${activeGameCode === g.code ? 'active' : ''}" onclick="selectGame('${g.code}')">
          <i class="fa-solid ${g.icon}"></i>
          <span>${g.title}</span>
        </button>
      `).join('');
    }

    function selectGame(code) {
      haptic('tap');
      activeGameCode = code;
      renderGameStrip();
      const activePill = document.querySelector('.game-pill.active');
      if (activePill && activePill.scrollIntoView) {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
      renderGameStage();
    }

    function renderGameStage() {
      const cat = GAME_CATALOG.find(g => g.code === activeGameCode);
      document.getElementById('topic-banner').innerHTML = `
        <div>
          <span class="topic-en">${cat.code} • ${cat.en}</span>
          <h2 class="topic-ar">${cat.title}</h2>
        </div>
        <span class="tag-chip tag-violet">تطبيق تفاعلي</span>
      `;

      const stage = document.getElementById('game-stage');
      switch (activeGameCode) {
        case 'QUIZ': renderQuizGame(stage); break;
        case 'FLASH': renderFlashGame(stage); break;
        case 'TF': renderTFGame(stage); break;
        case 'DND-SORT': renderDndGame(stage); break;
        case 'HOTSPOT': renderHotspotGame(stage); break;
        case 'SLIDER-ANG': renderSliderAngleGame(stage); break;
        case 'CALC-BOX': renderCalcBoxGame(stage); break;
        case 'STEP-ORDER': renderStepOrderGame(stage); break;
        case 'COLOR-SIM': renderColorSimGame(stage); break;
        case 'MATCH-PAIR': renderMatchPairGame(stage); break;
      }
    }

    // ========= GAME 1: QUIZ =========
    let quizFilter = 'all', quizIdx = 0, quizAnswered = null;

    function getFilteredQuiz() {
      return quizFilter === 'all' ? QUIZ_DATA : QUIZ_DATA.filter(q => q.session === Number(quizFilter));
    }

    function renderQuizGame(stage) {
      const list = getFilteredQuiz();
      if (quizIdx >= list.length) quizIdx = 0;
      const item = list[quizIdx];

      stage.className = 'academic-card border-violet';
      stage.innerHTML = `
        <div class="card-title">
          <span><i class="fa-solid fa-circle-question icon-violet"></i> السؤال ${quizIdx + 1} / ${list.length}</span>
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            ${['all','1','2','3'].map(f => `
              <button class="btn btn-sm ${quizFilter===f?'btn-primary':'btn-outline'}" onclick="setQuizFilter('${f}')">${f==='all'?'الكل':'ج'+f}</button>
            `).join('')}
          </div>
        </div>
        <div class="sub-box">
          <span class="tag-chip tag-violet">الجلسة ${item.session}</span>
          <h3 style="margin-top:6px; font-size:1.05rem;">${item.q}</h3>
        </div>
        <div>
          ${item.options.map((opt, idx) => {
            let cls = 'option-btn', ic = '<i class="fa-regular fa-circle"></i>';
            if (quizAnswered !== null) {
              if (idx === item.correct) { cls += ' correct'; ic = '<i class="fa-solid fa-circle-check"></i>'; }
              else if (idx === quizAnswered) { cls += ' wrong'; ic = '<i class="fa-solid fa-circle-xmark"></i>'; }
            }
            return `<button class="${cls}" ${quizAnswered!==null?'disabled':''} onclick="answerQuiz(${idx})"><span>${opt}</span><span>${ic}</span></button>`;
          }).join('')}
        </div>
        ${quizAnswered !== null ? `
          <div class="feedback-panel ${quizAnswered===item.correct?'success':'error'}">
            <strong>${quizAnswered===item.correct?'إجابة صحيحة!':'التعليل العلمي:'}</strong>
            <ul class="styled-list">${item.options.map((o,i)=>`<li><strong>${o}:</strong> ${item.reasons[i]}</li>`).join('')}</ul>
          </div>
        ` : ''}
        <div style="display:flex; justify-content:space-between; margin-top:14px; gap:8px;">
          <button class="btn btn-outline" onclick="prevQuiz()"><i class="fa-solid fa-arrow-right"></i> السابق</button>
          <button class="btn btn-primary" onclick="nextQuiz()">التالي <i class="fa-solid fa-arrow-left"></i></button>
        </div>
      `;
    }

    function setQuizFilter(f) { quizFilter = f; quizIdx = 0; quizAnswered = null; renderGameStage(); }
    function answerQuiz(idx) {
      if (quizAnswered !== null) return;
      quizAnswered = idx;
      const item = getFilteredQuiz()[quizIdx];
      if (idx === item.correct) addXP(15, 'إجابة صحيحة');
      else recordMistake(item.id, `الجلسة ${item.session}`, item.q, `${item.options[item.correct]} — ${item.reasons[item.correct]}`);
      renderGameStage();
    }
    function nextQuiz() { const l = getFilteredQuiz(); quizIdx = (quizIdx + 1) % l.length; quizAnswered = null; renderGameStage(); }
    function prevQuiz() { const l = getFilteredQuiz(); quizIdx = (quizIdx - 1 + l.length) % l.length; quizAnswered = null; renderGameStage(); }

    function toggleFlashFlip() { haptic('tap'); flashFlipped = !flashFlipped; renderGameStage(); }
    function nextFlash() { flashIdx = (flashIdx + 1) % FLASH_DATA.length; flashFlipped = false; renderGameStage(); }

    function markFlashMastered() {
      const c = FLASH_DATA[flashIdx];
      if (!appState.flashMastered.includes(c.id)) {
        appState.flashMastered.push(c.id);
        addXP(10, 'إتقان بطاقة');
      }
      nextFlash();
    }
    function markFlashReview() {
      const c = FLASH_DATA[flashIdx];
      appState.flashMastered = appState.flashMastered.filter(x => x !== c.id);
      recordMistake(c.id, c.cat, c.front, c.back);
      showToast('أُضيفت لبنك المراجعة', 'amber');
      nextFlash();

      }
      renderGameStage();

    function dndBucketClick(bucketId) { if (dndSelectedChip) attemptDndPlace(dndSelectedChip, bucketId); }

      const arena = DND_ARENAS[dndArenaIndex];
      const item = arena.items.find(x => x.id === itemId);
      if (!item) return;
      if (item.target === bucketId) {
        dndPlacements[itemId] = bucketId;
        dndSelectedChip = null;
        const left = arena.items.filter(it => !dndPlacements[it.id]).length;
        if (left === 0) addXP(30, 'إتمام ميدان التصنيف');
        else { appState.xp += 5; saveState(); haptic('success'); showToast('+5 XP صحيح', 'emerald'); }

        const right = arena.buckets.find(b => b.id === item.target).title;

              <button class="btn btn-emerald" onclick="executeInjection()"><i class="fa-solid fa-syringe"></i> نفّذ الحقن</button>
            </div>
            ${aspiratedChecked ? `
              <div class="feedback-panel ${currentLayer==='vein'?'info':'success'}">
                ${currentLayer==='vein'
                  ? 'ظهور قطرات دم (مطلوب في IV، ويوجب إيقاف الحقن وتغيير الموضع في IM!).'
                  : 'سحب نظيف خالٍ من الدم — آمن للحقن العضلي.'}
              </div>
            ` : ''}
          </div>
        </div>
        ${angResult ? `<div class="feedback-panel ${angResult.ok?'success':'error'}"><strong>${angResult.ok?'حقن سليم!':'تنبيه:'}</strong> ${angResult.msg}</div>` : ''}
      `;
    }
    function selectAngleMission(i) { angMissionIdx = i; aspiratedChecked = false; angResult = null; renderGameStage(); }
    function updateNeedleAngle(v) { currentAngle = Number(v); angResult = null; renderGameStage(); }
    function selectTargetLayer(l) { currentLayer = l; aspiratedChecked = false; angResult = null; renderGameStage(); }
    function runAspirationTest() { haptic('tap'); aspiratedChecked = true; renderGameStage(); }
    function executeInjection() {
      const m = ANGLE_MISSIONS[angMissionIdx];
      if (m.needAspirate && !aspiratedChecked) {
        angResult = { ok: false, msg: `يجب إجراء اختبار السحب الارتجاعي أولاً في ${m.name}.` };
        renderGameStage();
        return;
      }
      if (currentAngle >= m.minAng && currentAngle <= m.maxAng && currentLayer === m.targetLayer) {
        angResult = { ok: true, msg: m.note };
        addXP(25, `إتمام محاكاة ${m.id}`);
      } else {
        angResult = { ok: false, msg: `الزاوية المناسبة (${m.minAng}°-${m.maxAng}°) والطبقة الصحيحة مطلوبة. ${m.note}` };
        recordMistake('ang_' + m.id, 'محاكي زوايا الإبر', m.name, m.note);
      }
      renderGameStage();
    }

    // ========= GAME 7: CALC-BOX (DOSE + T.I) =========
    let calcTab = 'dose';
    let doseProblem = { subject: 'طفل (مسألة المحاضرة 2 و3)', rawWeight: 20, unit: 'kg', dosePerKg: 5, percent: 2 };
    let doseChecked = null, showDoseSolution = false;
    let tiProblem = { drugA: { name: 'دواء A', ed50: 10, ld50: 800 }, drugB: { name: 'دواء B', ed50: 2, ld50: 6 }, safer: 'A' };
    let tiFeedback = null;

    function generateNewDoseProblem() {
      const pool = [
        { subject: 'طفل', weights: [12, 15, 20, 25, 30], unit: 'kg', doses: [4, 5, 8, 10], percents: [1, 2, 4, 5] },
        { subject: 'أرنب تجربة', weights: [2, 2.5, 3], unit: 'kg', doses: [10, 20, 40], percents: [1, 2, 5] },
        { subject: 'جرذ مخبري', weights: [250, 300, 400, 500], unit: 'g', doses: [10, 20, 25], percents: [0.5, 1, 2] },
        { subject: 'فأر أبيض', weights: [20, 25, 30], unit: 'g', doses: [20, 40, 50], percents: [0.2, 0.5, 1] }
      ];
      const p = pool[Math.floor(Math.random() * pool.length)];
      doseProblem = {
        subject: p.subject,
        rawWeight: p.weights[Math.floor(Math.random() * p.weights.length)],
        unit: p.unit,
        dosePerKg: p.doses[Math.floor(Math.random() * p.doses.length)],
        percent: p.percents[Math.floor(Math.random() * p.percents.length)]
      };
      doseChecked = null; showDoseSolution = false;
      renderGameStage();
    }

    function generateNewTIProblem() {
      const edA = [5, 10, 20][Math.floor(Math.random() * 3)];
      const mA = [30, 50, 80][Math.floor(Math.random() * 3)];
      const edB = [2, 4, 5][Math.floor(Math.random() * 3)];
      const mB = [2, 3, 4][Math.floor(Math.random() * 3)];
      const swap = Math.random() > 0.5;
      tiProblem = swap
        ? { drugA: { name: 'دواء A', ed50: edB, ld50: edB * mB }, drugB: { name: 'دواء B', ed50: edA, ld50: edA * mA }, safer: 'B' }
        : { drugA: { name: 'دواء A', ed50: edA, ld50: edA * mA }, drugB: { name: 'دواء B', ed50: edB, ld50: edB * mB }, safer: 'A' };
      tiFeedback = null;
      renderGameStage();
    }

    function renderCalcBoxGame(stage) {
      const wKg = doseProblem.unit === 'kg' ? doseProblem.rawWeight : doseProblem.rawWeight / 1000;
      const conc100 = doseProblem.percent * 1000;
      const totalMg = +(wKg * doseProblem.dosePerKg).toFixed(4);
      const vol = +((totalMg * 100) / conc100).toFixed(4);

      stage.className = 'academic-card border-violet';
      stage.innerHTML = `
        <div class="card-title">
          <span><i class="fa-solid fa-calculator icon-violet"></i> الحسابات الصيدلانية</span>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm ${calcTab==='dose'?'btn-primary':'btn-outline'}" onclick="calcTab='dose';renderGameStage()">حساب الجرعة</button>
            <button class="btn btn-sm ${calcTab==='ti'?'btn-primary':'btn-outline'}" onclick="calcTab='ti';renderGameStage()">المؤشر العلاجي T.I</button>
          </div>
        </div>

        ${calcTab === 'dose' ? `
          <div class="sub-box">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <span class="tag-chip tag-violet">${doseProblem.subject}</span>
              <button class="btn btn-cyan btn-sm" onclick="generateNewDoseProblem()"><i class="fa-solid fa-shuffle"></i> مسألة جديدة</button>
            </div>
            <p style="margin-top:8px; font-weight:700;">
              الوزن: ${doseProblem.rawWeight} ${doseProblem.unit==='kg'?'كغ':'غ'} | الجرعة: ${doseProblem.dosePerKg} ملغ/كغ | التركيز: ${doseProblem.percent}%
            </p>
          </div>
          <div class="grid-2">
            <div class="step-box"><label style="font-weight:700;font-size:0.86rem;">1. الوزن بالكغ (kg):</label><input type="number" step="any" id="inp-wkg" class="calc-input" placeholder="مثال: 20"></div>
            <div class="step-box"><label style="font-weight:700;font-size:0.86rem;">2. الملغ في 100 سم³:</label><input type="number" step="any" id="inp-mg100" class="calc-input" placeholder="2% = 2000"></div>
            <div class="step-box"><label style="font-weight:700;font-size:0.86rem;">3. الجرعة الكلية (mg):</label><input type="number" step="any" id="inp-totalmg" class="calc-input" placeholder="الوزن × الجرعة"></div>
            <div class="step-box"><label style="font-weight:700;font-size:0.86rem;">4. الحجم المطلوب (cm³):</label><input type="number" step="any" id="inp-vol" class="calc-input" placeholder="سم³ / مل"></div>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <button class="btn btn-emerald" onclick="verifyDoseInputs(${wKg},${conc100},${totalMg},${vol})"><i class="fa-solid fa-check"></i> تحقق</button>
            <button class="btn btn-outline" onclick="showDoseSolution=!showDoseSolution;renderGameStage()"><i class="fa-solid fa-eye"></i> الحل</button>
          </div>
          ${doseChecked ? `
            <div class="feedback-panel ${doseChecked.allOk?'success':'error'}">
              <ul class="styled-list">
                <li>الوزن: ${doseChecked.s1?'✓':`✗ (${wKg} kg)`}</li>
                <li>التركيز: ${doseChecked.s2?'✓':`✗ (${conc100} mg/100cm³)`}</li>
                <li>الجرعة الكلية: ${doseChecked.s3?'✓':`✗ (${totalMg} mg)`}</li>
                <li>الحجم: ${doseChecked.s4?'✓':`✗ (${vol} cm³)`}</li>
              </ul>
            </div>` : ''}
          ${showDoseSolution ? `<div class="formula-box">Dose = ${wKg} × ${doseProblem.dosePerKg} = ${totalMg} mg | Volume = (${totalMg} × 100) / ${conc100} = ${vol} cm³</div>` : ''}
        ` : `
          <div class="sub-box" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <span class="tag-chip tag-violet">T.I = L.D.50 / E.D.50</span>
            <button class="btn btn-cyan btn-sm" onclick="generateNewTIProblem()"><i class="fa-solid fa-shuffle"></i> مثال جديد</button>
          </div>
          <div class="grid-2">
            <div class="step-box">
              <strong>${tiProblem.drugA.name}</strong> (ED50=${tiProblem.drugA.ed50}, LD50=${tiProblem.drugA.ld50})
              <input type="number" step="any" id="inp-tia" class="calc-input" style="margin-top:6px;" placeholder="T.I للدواء A">
            </div>
            <div class="step-box">
              <strong>${tiProblem.drugB.name}</strong> (ED50=${tiProblem.drugB.ed50}, LD50=${tiProblem.drugB.ld50})
              <input type="number" step="any" id="inp-tib" class="calc-input" style="margin-top:6px;" placeholder="T.I للدواء B">
            </div>
          </div>
          <div class="grid-2">
            <button class="btn btn-emerald" onclick="verifyTIInputs('A')">الدواء A أكثر أماناً</button>
            <button class="btn btn-amber" onclick="verifyTIInputs('B')">الدواء B أكثر أماناً</button>
          </div>
          ${tiFeedback ? `<div class="feedback-panel ${tiFeedback.ok?'success':'error'}"><strong>${tiFeedback.title}</strong> ${tiFeedback.msg}</div>` : ''}
        `}
      `;
    }

    function approxEq(a, b) { return !isNaN(a) && Math.abs(a - b) <= Math.max(0.02, b * 0.02); }
    function verifyDoseInputs(wKg, conc100, totalMg, vol) {
      const s1 = approxEq(parseFloat(document.getElementById('inp-wkg').value), wKg);
      const s2 = approxEq(parseFloat(document.getElementById('inp-mg100').value), conc100);
      const s3 = approxEq(parseFloat(document.getElementById('inp-totalmg').value), totalMg);
      const s4 = approxEq(parseFloat(document.getElementById('inp-vol').value), vol);
      const allOk = s1 && s2 && s3 && s4;
      doseChecked = { s1, s2, s3, s4, allOk };
      if (allOk) addXP(25, 'حل مسألة الجرعة');
      else recordMistake('calc_' + doseProblem.rawWeight, 'حساب الجرعات', `${doseProblem.subject}: ${doseProblem.rawWeight}${doseProblem.unit}, ${doseProblem.dosePerKg}mg/kg, ${doseProblem.percent}%`, `الحجم = ${vol} cm³`);
      renderGameStage();
    }
    function verifyTIInputs(picked) {
      const a = parseFloat(document.getElementById('inp-tia').value);
      const b = parseFloat(document.getElementById('inp-tib').value);
      const rA = tiProblem.drugA.ld50 / tiProblem.drugA.ed50;
      const rB = tiProblem.drugB.ld50 / tiProblem.drugB.ed50;
      const ok = approxEq(a, rA) && approxEq(b, rB) && picked === tiProblem.safer;
      if (ok) {
        tiFeedback = { ok: true, title: 'صحيح!', msg: `T.I(A)=${rA} و T.I(B)=${rB}. الأعلى مؤشراً أكثر أماناً (كالسلفا والبنسلينات مقارنة بالديجتالين).` };
        addXP(20, 'تحليل المؤشر العلاجي');
      } else {
        tiFeedback = { ok: false, title: 'راجع القيم:', msg: `T.I(A)=${rA}، T.I(B)=${rB}، الأكثر أماناً هو ${tiProblem.safer}.` };
        recordMistake('ti_calc', 'المؤشر العلاجي', 'T.I = LD50 / ED50', 'القيمة الأعلى تعني أماناً أوسع (سلفا وبنسلينات) والأقل أماناً أضيق (ديجتالين).');
      }
      renderGameStage();
    }

    // ========= GAME 8: STEP-ORDER =========
    let stepProtoIndex = 0, currentStepOrder = [], stepCheckedState = null;

    function initStepOrder(idx) {
      stepProtoIndex = idx;
      const raw = STEP_PROTOCOLS[idx].steps.map((t, i) => ({ origIdx: i, text: t }));
      currentStepOrder = [...raw].sort(() => Math.random() - 0.5);
      if (currentStepOrder.every((s, i) => s.origIdx === i) && currentStepOrder.length > 1) {
        [currentStepOrder[0], currentStepOrder[1]] = [currentStepOrder[1], currentStepOrder[0]];
      }
      stepCheckedState = null;
    }

    function renderStepOrderGame(stage) {
      if (currentStepOrder.length === 0) initStepOrder(stepProtoIndex);
      const proto = STEP_PROTOCOLS[stepProtoIndex];

      stage.className = 'academic-card border-cyan';
      stage.innerHTML = `
        <div class="card-title">
          <span><i class="fa-solid fa-list-ol icon-cyan"></i> ${proto.title}</span>
          <div style="display:flex; gap:5px;">
            ${STEP_PROTOCOLS.map((_, i) => `<button class="btn btn-sm ${i===stepProtoIndex?'btn-primary':'btn-outline'}" onclick="switchStepProto(${i})">${i+1}</button>`).join('')}
          </div>
        </div>
        <div>
          ${currentStepOrder.map((st, idx) => {
            const cls = stepCheckedState ? (st.origIdx === idx ? 'is-correct' : 'is-wrong') : '';
            return `
              <div class="step-order-item ${cls}">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="tag-chip tag-violet">${idx + 1}</span>
                  <span style="font-size:0.88rem; font-weight:600;">${st.text}</span>
                </div>
                <div style="display:flex; gap:4px; flex-shrink:0;">
                  <button class="btn btn-outline btn-sm" ${idx===0?'disabled':''} onclick="moveStep(${idx},-1)"><i class="fa-solid fa-arrow-up"></i></button>
                  <button class="btn btn-outline btn-sm" ${idx===currentStepOrder.length-1?'disabled':''} onclick="moveStep(${idx},1)"><i class="fa-solid fa-arrow-down"></i></button>
                </div>
              </div>`;
          }).join('')}
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-emerald" onclick="verifyStepOrder()"><i class="fa-solid fa-check"></i> تحقق من الترتيب</button>
          <button class="btn btn-outline" onclick="switchStepProto(${stepProtoIndex})"><i class="fa-solid fa-shuffle"></i> خلط</button>
        </div>
        ${stepCheckedState ? `<div class="feedback-panel ${stepCheckedState.allOk?'success':'error'}"><strong>${stepCheckedState.allOk?'تسلسل مخبري دقيق 100%!':'راجع البطاقات الحمراء وأعد ترتيبها.'}</strong></div>` : ''}
      `;
    }
    function switchStepProto(i) { initStepOrder(i); renderGameStage(); }
    function moveStep(idx, d) {
      const t = idx + d;
      if (t < 0 || t >= currentStepOrder.length) return;
      [currentStepOrder[idx], currentStepOrder[t]] = [currentStepOrder[t], currentStepOrder[idx]];
      stepCheckedState = null; haptic('tap'); renderGameStage();
    }
    function verifyStepOrder() {
      const allOk = currentStepOrder.every((st, i) => st.origIdx === i);
      stepCheckedState = { allOk };
      if (allOk) addXP(25, 'ترتيب البروتوكول');
      else recordMistake('step_' + stepProtoIndex, STEP_PROTOCOLS[stepProtoIndex].title, 'تسلسل الخطوات', STEP_PROTOCOLS[stepProtoIndex].steps.join(' ← '));
      renderGameStage();
    }

    // ========= GAME 9: COLOR-SIM (KI IN SALIVA LAB) =========
    let colorLab = {
      blankDone: false, solutionDrunk: false,
      dropsAcid: 0, dropsStarch: 0, dropsH2O2: 0,
      waited30s: false, activeTime: 0,
      tableAnswers: { 0: '', 20: '', 40: '', 60: '' },
      tableChecked: null, labMsg: null
    };

    function renderColorSimGame(stage) {
      const t = colorLab.activeTime;
      let stainStyle = 'background: transparent; opacity: 0;';
      let colorLabel = 'شاهد سلبي قبل الإعطاء (لا يوجد لون)';
      if (colorLab.waited30s) {
        if (t === 0) {
          stainStyle = 'background: radial-gradient(circle, rgba(241,245,249,0.9), transparent); opacity: 0.3;';
          colorLabel = 'عديم اللون (لعاب خالٍ من يودور البوتاسيوم ✓)';
        } else if (t === 20) {
          stainStyle = 'background: radial-gradient(circle, #818CF8 15%, #A78BFA 55%, transparent 80%); opacity: 0.58;';
          colorLabel = 'لون بنفسجي / أزرق خفيف (بداية الإطراح اللعابي)';
        } else if (t === 40) {
          stainStyle = 'background: radial-gradient(circle, #4F46E5 20%, #7C3AED 60%, transparent 85%); opacity: 0.84;';
          colorLabel = 'لون أزرق بنفسجي واضح وقوي';
        } else if (t === 60) {
          stainStyle = 'background: radial-gradient(circle, #312E81 25%, #5B21B6 65%, transparent 90%); opacity: 0.98;';
          colorLabel = 'لون بنفسجي أزرق داكن وكثيف';
        }
      }

      stage.className = 'academic-card border-emerald';
      stage.innerHTML = `
        <div class="card-title">
          <span><i class="fa-solid fa-vial icon-emerald"></i> مختبر كشف KI في اللعاب</span>
          <button class="btn btn-outline btn-sm" onclick="resetColorSim()"><i class="fa-solid fa-rotate"></i> إعادة</button>
        </div>

        <div class="grid-2">
          <div>
            <div class="step-box">
              <div class="step-title" style="color:var(--accent-rose);">1. الشاهد والشرب</div>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                <button class="btn btn-sm ${colorLab.blankDone?'btn-emerald':'btn-primary'}" onclick="runBlankControl()">فحص الشاهد ${colorLab.blankDone?'✓':''}</button>
                <button class="btn btn-sm ${colorLab.solutionDrunk?'btn-emerald':'btn-cyan'}" onclick="drinkKISolution()">شرب 100مل + 0.5غ KI ${colorLab.solutionDrunk?'✓':''}</button>
              </div>
            </div>
            <div class="step-box">
              <div class="step-title" style="color:var(--accent-violet-dark);">2. قطرات ورقة الترشيح</div>
              <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:6px;">1 حمض الكبريت + 1 نشاء 1% + 2 ماء أوكسجيني 3%</p>
              <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px;">
                <button class="btn btn-sm btn-outline" onclick="addReagent('acid')">+ كبريت (${colorLab.dropsAcid})</button>
                <button class="btn btn-sm btn-outline" onclick="addReagent('starch')">+ نشاء 1% (${colorLab.dropsStarch})</button>
                <button class="btn btn-sm btn-outline" onclick="addReagent('h2o2')">+ H2O2 3% (${colorLab.dropsH2O2})</button>
              </div>
              <button class="btn btn-primary btn-sm" style="width:100%;" onclick="waitReaction30s()">انتظر نصف دقيقة (30 ث)</button>
            </div>
            <div class="step-box">
              <div class="step-title" style="color:var(--accent-amber);">3. الزمن: ${t===0?'قبل الإعطاء':t+' دقيقة'}</div>
              <input type="range" min="0" max="60" step="20" value="${t}" class="styled-slider" oninput="setSimTime(this.value)">
              <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:700;">
                <span>قبل (0)</span><span>20 د</span><span>40 د</span><span>60 د</span>
              </div>
            </div>
          </div>

          <div style="text-align:center;">
            <div class="sub-box">
              <div class="filter-paper-disc"><div class="filter-stain" style="${stainStyle}"></div></div>
              <p style="margin-top:10px; font-weight:700; font-size:0.86rem;">
                ${colorLab.waited30s ? colorLabel : 'أضف الكواشف وانتظر نصف دقيقة...'}
              </p>
            </div>
            <div class="sub-box" style="margin-bottom:0;">
              <svg viewBox="0 0 320 105" style="width:100%; height:auto;">
                <rect x="0" y="0" width="320" height="105" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
                <line x1="35" y1="82" x2="295" y2="82" stroke="#94A3B8" stroke-width="1.5"/>
                <polyline fill="none" stroke="#6D28D9" stroke-width="3" points="45,78 125,56 205,34 285,18"/>
                ${[{t:0,x:45,y:78},{t:20,x:125,y:56},{t:40,x:205,y:34},{t:60,x:285,y:18}].map(pt=>`
                  <circle cx="${pt.x}" cy="${pt.y}" r="${t===pt.t?7:4.5}" fill="${t===pt.t?'#F59E0B':'#8B5CF6'}" stroke="#FFFFFF" stroke-width="1.5"/>
                  <text x="${pt.x}" y="97" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-size="10" fill="#475569">${pt.t}د</text>
                `).join('')}
              </svg>
            </div>
          </div>
        </div>

        ${colorLab.labMsg ? `<div class="feedback-panel ${colorLab.labMsg.type}"><strong>${colorLab.labMsg.text}</strong></div>` : ''}

        <div class="sub-box" style="margin-top:12px; margin-bottom:0;">
          <strong style="display:block; margin-bottom:8px; font-size:0.9rem;">سجّل جدول نتائج التجربة وتحقق منه:</strong>
          <div class="table-wrap">
            <table class="academic-table">
              <thead><tr><th>الوقت</th><th>النتيجة في اللعاب</th></tr></thead>
              <tbody>
                ${[0,20,40,60].map(tp => `
                  <tr>
                    <td><strong>${tp===0?'قبل الإعطاء':tp+' دقيقة'}</strong></td>
                    <td>
                      <select class="calc-input" style="direction:rtl; text-align:right; font-size:0.84rem;" onchange="colorLab.tableAnswers[${tp}]=this.value">
                        <option value="">-- اختر --</option>
                        <option value="neg" ${colorLab.tableAnswers[tp]==='neg'?'selected':''}>سلبي (عديم اللون)</option>
                        <option value="pos_light" ${colorLab.tableAnswers[tp]==='pos_light'?'selected':''}>إيجابي (بنفسجي/أزرق خفيف)</option>
                        <option value="pos_med" ${colorLab.tableAnswers[tp]==='pos_med'?'selected':''}>إيجابي (أزرق بنفسجي واضح)</option>
                        <option value="pos_deep" ${colorLab.tableAnswers[tp]==='pos_deep'?'selected':''}>إيجابي (بنفسجي داكن كثيف)</option>
                      </select>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <button class="btn btn-emerald btn-sm" style="margin-top:10px; width:100%;" onclick="verifyColorLabTable()">تحقق من الجدول (+35 XP)</button>
          ${colorLab.tableChecked ? `<div class="feedback-panel ${colorLab.tableChecked.ok?'success':'error'}">${colorLab.tableChecked.msg}</div>` : ''}
        </div>
      `;
    }

    function resetColorSim() {
      colorLab = { blankDone: false, solutionDrunk: false, dropsAcid: 0, dropsStarch: 0, dropsH2O2: 0, waited30s: false, activeTime: 0, tableAnswers: {0:'',20:'',40:'',60:''}, tableChecked: null, labMsg: null };
      renderGameStage();
    }
    function runBlankControl() {
      colorLab.blankDone = true; colorLab.activeTime = 0;
      colorLab.labMsg = { type: 'success', text: 'تم فحص الشاهد قبل الإعطاء وإثبات خلو اللعاب من KI.' };
      haptic('success'); renderGameStage();
    }
    function drinkKISolution() {
      if (!colorLab.blankDone) {
        colorLab.labMsg = { type: 'error', text: 'تحذير: افحص الشاهد أولاً قبل شرب 100 مل + 0.5 غ KI!' };
        haptic('error'); renderGameStage(); return;
      }
      colorLab.solutionDrunk = true; colorLab.activeTime = 20;
      colorLab.labMsg = { type: 'info', text: 'تم الشرب! أضف الآن 1 كبريت + 1 نشاء 1% + 2 ماء أوكسجيني 3%.' };
      renderGameStage();
    }
    function addReagent(k) {
      haptic('tap');
      if (k==='acid') colorLab.dropsAcid++;
      if (k==='starch') colorLab.dropsStarch++;
      if (k==='h2o2') colorLab.dropsH2O2++;
      colorLab.waited30s = false;
      renderGameStage();
    }
    function waitReaction30s() {
      if (colorLab.dropsAcid!==1 || colorLab.dropsStarch!==1 || colorLab.dropsH2O2!==2) {
        colorLab.labMsg = { type: 'error', text: `خطأ بالقطرات! المطلوب (1 كبريت، 1 نشاء، 2 ماء أوكسجيني). أُعيد تصفير القطرات.` };
        colorLab.dropsAcid = 0; colorLab.dropsStarch = 0; colorLab.dropsH2O2 = 0;
        haptic('error'); renderGameStage(); return;
      }
      colorLab.waited30s = true;
      colorLab.labMsg = { type: 'success', text: colorLab.solutionDrunk ? 'تشكل اللون البنفسجي/الأزرق! حرّك شريط الزمن للمراقبة.' : 'الشاهد سلبي تماماً كما هو مطلوب.' };
      haptic('success'); renderGameStage();
    }
    function setSimTime(v) {
      const n = Number(v);
      if (n > 0 && !colorLab.solutionDrunk) {
        colorLab.labMsg = { type: 'error', text: 'اشرب محلول KI أولاً قبل قياس الأزمنة التالية!' };
        renderGameStage(); return;
      }
      colorLab.activeTime = n; renderGameStage();
    }
    function verifyColorLabTable() {
      const a = colorLab.tableAnswers;
      if (a[0]==='neg' && a[20]==='pos_light' && a[40]==='pos_med' && a[60]==='pos_deep') {
        colorLab.tableChecked = { ok: true, msg: 'نتائج مخبرية ممتازة وصحيحة!' };
        addXP(35, 'إتمام مختبر كشف KI في اللعاب');
      } else {
        colorLab.tableChecked = { ok: false, msg: 'تذكر: الشاهد سلبي، ثم يتصاعد اللون البنفسجي/الأزرق تدريجياً عند 20 و40 و60 دقيقة.' };
        recordMistake('color_table', 'تجربة اللعاب', 'نتائج الكشف عبر الزمن', 'قبل الإعطاء: سلبي | 20، 40، 60 دقيقة: يظهر ويزداد اللون البنفسجي أو الأزرق.');
      }
      renderGameStage();
    }

    // ========= GAME 10: MATCH-PAIR =========
    let matchBoardIndex = 0, matchShuffledRight = [], matchSelectedLeft = null, matchMatchedIds = [];

    function initMatchBoard(idx) {
      matchBoardIndex = idx;
      matchShuffledRight = [...MATCH_BOARDS[idx].pairs].sort(() => Math.random() - 0.5);
      matchSelectedLeft = null;
      matchMatchedIds = [];
    }

    function renderMatchPairGame(stage) {
      if (matchShuffledRight.length === 0) initMatchBoard(matchBoardIndex);
      const board = MATCH_BOARDS[matchBoardIndex];

      stage.className = 'academic-card border-amber';
      stage.innerHTML = `
        <div class="card-title">
          <span><i class="fa-solid fa-link icon-amber"></i> ${board.title}</span>
          <div style="display:flex; gap:5px;">
            ${MATCH_BOARDS.map((_, i) => `<button class="btn btn-sm ${i===matchBoardIndex?'btn-primary':'btn-outline'}" onclick="initMatchBoard(${i});renderGameStage()">لوحة ${i+1}</button>`).join('')}
          </div>
        </div>
        <div class="match-grid">
          <div>
            ${board.pairs.map(p => {
              const m = matchMatchedIds.includes(p.id), s = matchSelectedLeft === p.id;
              return `<div class="match-card ${m?'matched':(s?'selected':'')}" onclick="${m?'':`selectLeftMatch('${p.id}')`}"><span>${p.left}</span>${m?'<i class="fa-solid fa-check icon-emerald"></i>':''}</div>`;
            }).join('')}
          </div>
          <div>
            ${matchShuffledRight.map(p => {
              const m = matchMatchedIds.includes(p.id);
              return `<div class="match-card ${m?'matched':''}" onclick="${m?'':`selectRightMatch('${p.id}')`}"><span>${p.right}</span>${m?'<i class="fa-solid fa-link icon-emerald"></i>':''}</div>`;
            }).join('')}
          </div>
        </div>
        <div style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" onclick="initMatchBoard(${matchBoardIndex});renderGameStage()"><i class="fa-solid fa-rotate"></i> إعادة خلط</button>
        </div>
      `;
    }

    function selectLeftMatch(id) { haptic('tap'); matchSelectedLeft = (matchSelectedLeft === id ? null : id); renderGameStage(); }
    function selectRightMatch(rightId) {
      if (!matchSelectedLeft) { showToast('اختر عنصراً من اليمين أولاً', 'amber'); return; }
      const board = MATCH_BOARDS[matchBoardIndex];
      if (matchSelectedLeft === rightId) {
        matchMatchedIds.push(rightId);
        matchSelectedLeft = null;
        if (matchMatchedIds.length === board.pairs.length) addXP(25, 'إتمام لوحة المطابقة');
        else { appState.xp += 5; saveState(); haptic('success'); showToast('+5 XP متطابق', 'emerald'); }
      } else {
        const lObj = board.pairs.find(p => p.id === matchSelectedLeft);
        recordMistake('m_' + lObj.id, board.title, lObj.left, lObj.right);
        matchSelectedLeft = null;
        showToast('غير مطابق — حاول مجدداً', 'rose');
      }
      renderGameStage();
    }

    // ========= INITIALIZATION =========
    document.addEventListener('DOMContentLoaded', () => {
      initTelegramApp();
      updateHUD();
      renderGameStrip();
      renderGameStage();
    });
  </script>
</body>
</html>
