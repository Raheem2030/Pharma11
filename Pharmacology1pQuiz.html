    <script>
        // ==========================================
        // DATA 1: ALL 50 FLASHCARDS
        // ==========================================
        const flashcardsData = [
            // القسم 1: الأهداف الدوائية والمستقبلات (1 - 6)
            { id: 1, cat: "1. الأهداف والمستقبلات", accent: "purple", icon: "fa-bullseye",
              q: "ما هو «الهدف الدوائي» (Pharmacological Target) وما هي أنواعه الأربعة الرئيسية؟",
              a: "هو الكيان الكيميائي الذي يرتبط به الدواء أولاً داخل الجسم لإحداث تأثير دوائي. أنواعه الأربعة: المستقبلات، القنوات الأيونية، الإنزيمات، والنواقل الجزيئية.",
              exp: "تعمل الأدوية عبر استهداف جزيئات حيوية محددة؛ والأهداف الأربعة هي الركائز الأساسية التي تنظم عمل الخلايا والأنسجة." },
            { id: 2, cat: "1. الأهداف والمستقبلات", accent: "purple", icon: "fa-satellite-dish",
              q: "عرّف المستقبلات الدوائية (Receptors) وأين تتوضع في الخلية؟",
              a: "هي جزيئات بروتينية متخصصة مستهدفة، تتواجد غالباً على سطح الخلية (بجزء خارج خلوي وآخر داخل خلوي) أو داخل الخلية.",
              exp: "تعمل كأجهزة استقبال للرابط الكيميائي (اللجين) ونقل الإشارة الكيميائية إلى استجابة حيوية داخل الخلية." },
            { id: 3, cat: "1. الأهداف والمستقبلات", accent: "emerald", icon: "fa-layer-group",
              q: "ما هي الأنواع الأربعة الرئيسية للمستقبلات الدوائية؟",
              a: "1. القنوات الأيونية ذات البوابة اللجائندية، 2. المستقبلات المقترنة بالبروتين G (GPCR)، 3. المستقبلات المرتبطة بالإنزيمات، 4. المستقبلات داخل الخلوية.",
              exp: "تختلف هذه العوائل في سرعة الاستجابة، وآلية نقل الإشارة الخلوية، ونوع المراسيل الثانوية المستخدمة." },
            { id: 4, cat: "1. الأهداف والمستقبلات", accent: "cyan", icon: "fa-bolt",
              q: "لماذا تُعد القنوات الأيونية ذات البوابة اللجائندية أسرع المستقبلات من حيث بدء الاستجابة؟",
              a: "لأنها لا تحتاج إلى مراسيل ثانوية (Second messengers)؛ فتح المسام وتدفق الأيونات يحدث فور ارتباط اللجين.",
              exp: "ارتباط الناقل بموقعه خارج الخلية يغير شكل القناة مباشرة فيسمح بمرور الأيونات (مثل الصوديوم) وزوال الاستقطاب خلال أجزاء من المليثانية." },
            { id: 5, cat: "1. الأهداف والمستقبلات", accent: "cyan", icon: "fa-plug-circle-bolt",
              q: "ما آلية عمل المستقبل النيكوتيني ($nAChR$) وما الأيون المسؤول عن تأثيره؟",
              a: "يرتبط الأستيل كولين بالجزء الخارجي للمستقبل، فيفتح القناة ليسمح بتدفق أيونات الصوديوم ($Na^+$) لداخل الخلية محدثاً زوال استقطاب (Depolarization).",
              exp: "دخول الصوديوم الموجب يقلل السلبية داخل الخلية مما يسبب استثارة عصبية أو تقلصاً عضلياً حسب نسيج العضو الهدف." },
            { id: 6, cat: "1. الأهداف والمستقبلات", accent: "amber", icon: "fa-gears",
              q: "كيف يعمل المستقبل المقترن بالبروتين G (GPCR) في حالة الراحة مقارنة بحالة التفعيل؟",
              a: "في حالة الراحة يكون المستقبل منفصلاً تماماً عن البروتين G. عند ارتباط اللجين بالناحية خارج الخلوية يتفعل البروتين G.",
              exp: "البروتين G هو وسيط الإشارة الخلوية؛ تفعيله ينشط إنزيمات أو قنوات تحفز تشكيل مراسيل ثانوية داخل الخلية." },

            // القسم 2: بروتينات G الإشارية (7 - 10)
            { id: 7, cat: "2. بروتينات G الإشارية", accent: "emerald", icon: "fa-arrow-up-right-dots",
              q: "ما هي آلية عمل والتأثير الخلوي لبروتين G المنبه ($G_s$)؟",
              a: "يفعل إنزيم الأدينيليل سيكلاز (Adenylyl cyclase)، مما يحول $ATP$ إلى $cAMP$ (مرسال ثانوي)، فيزيد دخول الكالسيوم أو يفعل الإنزيمات.",
              exp: "يُستخدم هذا المسار لزيادة الفعالية الحيوية؛ ومثاله تفعيل مستقبلات بيتا ($\\beta$) بتأثير الأدرينالين لزيادة ضربات القلب." },
            { id: 8, cat: "2. بروتينات G الإشارية", accent: "rose", icon: "fa-arrow-down-wide-short",
              q: "ما هي آلية عمل والتأثير الخلوي لبروتين G المثبط ($G_i$)؟",
              a: "يثبط إنزيم الأدينيليل سيكلاز (Adenylyl cyclase)، فينقص تحول $ATP$ إلى $cAMP$، وينقص دخول الكالسيوم وتفتح قنوات البوتاسيوم.",
              exp: "انخفاض $cAMP$ يؤدي لتثبيط النشاط الخلوي وفرط استقطاب؛ ومثاله تفعيل مستقبلات $M_2$ بالأستيل كولين لإبطاء القلب." },
            { id: 9, cat: "2. بروتينات G الإشارية", accent: "purple", icon: "fa-code-branch",
              q: "ما الإنزيم الذي يفعله بروتين $G_q$ وما هما المرسالان الثانويان الناتجان عنه؟",
              a: "يفعل إنزيم الفوسفوليباز C (Phospholipase C)، فيستحدث مرسالين ثانويين هما: إينوزيتول ثلاثي الفوسفات ($IP_3$) وثنائي أسيل الغليسيرول ($DAG$).",
              exp: "$IP_3$ يحرر الكالسيوم المخزون بالشبكة الهيولية، و$DAG$ مع الكالسيوم يفعلان بروتين كيناز C ($PKC$) لبدء شلال الفسفرة." },
            { id: 10, cat: "2. بروتينات G الإشارية", accent: "cyan", icon: "fa-table-columns",
              q: "أي المستقبلات الموسكارينية تقترن ببروتين $G_q$ وأيها تقترن ببروتين $G_i$؟",
              a: "المستقبلات ($M_1, M_3, M_5$) تقترن ببروتين $G_q$. والمستقبلات ($M_2, M_4$) تقترن ببروتين $G_i$.",
              exp: "النمط الفردي ($1,3,5$) ينشط الكالسيوم عبر $IP_3/DAG$، بينما النمط الزوجي ($2,4$) يثبط $cAMP$ ويفتح قنوات البوتاسيوم." },

            // القسم 3: تنظيم الجهاز العصبي (11 - 14)
            { id: 11, cat: "3. تنظيم الجهاز العصبي", accent: "cyan", icon: "fa-sitemap",
              q: "ما هي مكونات القسم الصادر من الجملة العصبية المحيطية (PNS)؟",
              a: "يتكون من الجملة العصبية الجسدية والجملة العصبية المستقلة (التي تضم: الودية، نظيرة الودية، والجملة المعوية).",
              exp: "الجسدية تتحكم بالعضلات الإرادية، بينما المستقلة تنظم الأعضاء اللاإرادية والأحشاء." },
            { id: 12, cat: "3. تنظيم الجهاز العصبي", accent: "purple", icon: "fa-circle-nodes",
              q: "ما الفرق بين أجسام خلايا العصبونات قبل العقدية وبعد العقدية في الجهاز العصبي المستقل؟",

            { id: 13, cat: "3. تنظيم الجهاز العصبي", accent: "emerald", icon: "fa-brain",

              a: "تنشأ من نوى الأعصاب القحفية في جذع الدماغ، ومن القطعتين النخاعيتين العجزيتين الثانية والثالثة ($S_2, S_3$).",
              exp: "يُدعى الجهاز نظير الودي لذلك بالمنشأ «القحفي العجزي» (Craniosacral)." },
            { id: 14, cat: "3. تنظيم الجهاز العصبي", accent: "amber", icon: "fa-ruler-horizontal",
              q: "كيف يختلف طول الألياف قبل وبعد العقدية في الجهاز نظير الودي؟",
              a: "الألياف قبل العقدية طويلة، بينما الألياف بعد العقدية قصيرة (لأن العقد قريبة جداً أو داخل جدار العضو).",

            // القسم 4: الاستثناءات في التعصيب الذاتي (15 - 16)
            { id: 15, cat: "4. استثناءات التعصيب الذاتي", accent: "amber", icon: "fa-triangle-exclamation",
              q: "ما هي الأعضاء الثلاثة المسجلة كاستثناءات للتعصيب المزدوج (تملك تعصيباً ودياً فقط)؟",
              a: "1. غدة الكظر، 2. الأوعية الدموية، 3. الغدد العرقية.",
              exp: "معظم أعضاء الجسم تتلقى تعصيباً مزدوجاً (ودياً ونظير ودي)، لكن هذه الأنسجة الثلاثة تخضع للسيطرة الودية فقط." },
            { id: 16, cat: "4. استثناءات التعصيب الذاتي", accent: "rose", icon: "fa-hand-sparkles",

              exp: "الغدة الكظرية تعتبر بمثابة عقدة ودية متطورة تلتقي بليف قبل عقدي كولينرجي، والغدد العرقية (بالكف والجبهة) استثناء ودي يستجيب للأستيل كولين." },

            // القسم 5: اصطناع وتوزع الأستيل كولين (17 - 20)
            { id: 17, cat: "5. اصطناع وتوزع ACh", accent: "purple", icon: "fa-flask",

              a: "يُصنع في العصارة الخلوية (Cytosol) للنهايات العصبية الكولينرجية، من تفاعل الكولين مع الأستيل كو-أ ($Acetyl\\text{-}CoA$).",
              exp: "الكولين يأتي من السائل خارج الخلوي، والأستيل كو-أ يُنتج داخل المتقدرات (Mitochondria) من الغلوكوز." },
            { id: 18, cat: "5. اصطناع وتوزع ACh", accent: "rose", icon: "fa-gauge-high",
              q: "ما هي الخطوة المحددة لسرعة اصطناع الأستيل كولين وما المركب الذي يثبطها؟",

              a: "$$\\text{Choline} + \\text{Acetyl-CoA} \\longrightarrow \\text{Acetylcholine}$$",

            { id: 20, cat: "5. اصطناع وتوزع ACh", accent: "emerald", icon: "fa-location-crosshairs",

              exp: "الأستيل كولين ناقل شامل يعمل في العقد الذاتية كافة، وفي نهايات المشابك نظيرة الودية والوصل العضلي الجسدي." },

              a: "الموسكارينية ($M$) تنتمي لمستقبلات GPCR المقترنة بالبروتين G، بينما النيكوتينية ($N$) قنوات أيونية ذات بوابة لجائندية.",
              exp: "الأول يتطلب وسائط بروتينية ومراسيل ثانوية، بينما الثاني يفتح مباشرة لتدفق شوارد الصوديوم." },
            { id: 22, cat: "6. المستقبلات الكولينرجية", accent: "purple", icon: "fa-unlock-keyhole",

            { id: 23, cat: "6. المستقبلات الكولينرجية", accent: "emerald", icon: "fa-map-pin",

            // القسم 7: التأثيرات على الأعضاء (24 - 29)

              a: "يسبب تقلص العضلات الدائرية للقزحية مما يؤدي لتقبض الحدقة (Miosis).",
              exp: "تقلص العضلة الدائرية يقلل قطر الحدقة وينقص تمددها عند التعرض للضوء أو العلاج بنظائر الودي." },

              correct: 1,

            { id: 26, sec: "القسم 6: التأثيرات الجهازية", accent: "rose",
              q: "ما هو التأثير الفسيولوجي الناجم عن ارتباط الأستيل كولين بالمستقبل $M_3$ في العضلات الملساء للقصبات الهوائية؟",
              options: ["أ) توسع قصبي ونقص المفرزات المخاطية", "ب) تقلص العضلات وحدوث تشنج قصبي وزيادة المفرزات (إحداث أعراض الربو)", "ج) تثبيط مراكز التنفس في الدماغ", "د) كل ما سبق صحيح"],
              correct: 1,
              exp: "ارتباط الأستيل كولين بـ $M_3$ في القصبات يؤدي إلى انقباض العضلات الملساء القصبية وزيادة إفراز المخاط، مما يسبب تشنجاً قصبياً يحاكي نوبة الربو." },
            { id: 27, sec: "القسم 6: التأثيرات الجهازية", accent: "rose",
              q: "كيف يؤثر الأستيل كولين على العضلة القلبية عبر المستقبل $M_2$؟",
              options: ["أ) ينشط الأدينيليل سيكلاز فيزيد ضربات القلب", "ب) يثبط إنزيم الأدينيليل سيكلاز فيخفض $cAMP$، مما ينقص معدل ضربات القلب وقوة انقباض العضلة", "ج) يحرر الكالسيوم عبر $IP_3$ فيسبب انقباضاً قلبياً شديداً", "د) كل ما سبق خطأ"],
              correct: 1,

            { id: 28, sec: "القسم 6: التأثيرات الجهازية", accent: "rose",
              q: "بالرغم من عدم وجود تعصيب نظير ودي للأوعية الدموية، كيف يُحدث الأستيل كولين المحقون خارجياً ارتخاءً وعائياً وهبوطاً في الضغط؟",
              options: ["أ) عبر الارتباط بالمستقبل $M_3$ في بطانة الأوعية وتحريض إفراز أكسيد النتريك ($NO$)", "ب) عبر الحصر المباشر لقنوات الصوديوم العضلية", "ج) عبر تنشيط الغدة الكظرية", "د) كل ما سبق خطأ"],
              correct: 0,
              exp: "تمتلك الأوعية مستقبلات $M_3$ في البطانة الوعائية دون تعصيب نظير ودي، وتنبيهها بالأستيل كولين الخارجي يحث البطانة على تحرير أكسيد النتريك ($NO$) الذي يسبب الارتخاء الوعائي وانخفاض الضغط." },
            { id: 29, sec: "القسم 6: التأثيرات الجهازية", accent: "rose",
              q: "ما هي آلية تأثير الجهاز نظير الودي على جدران الأعضاء الملساء ومصراتها (مثل المعدة والمثانة)؟",
              options: ["أ) تقلص جدران الأعضاء الملساء مع ارتخاء المصرات لتسهيل التفريغ", "ب) ارتخاء جدران الأعضاء مع تقلص المصرات لحياد التفريغ", "ج) تقلص الجدران والمصرات معاً بنفس الوقت", "د) كل ما سبق خطأ"],
              correct: 0,
              exp: "يتصف التأثير نظير الودي بالتآزر والتعاكس: تقلص عضلات الجدار (المعدة/المثانة) يقابله ارتخاء المصرات (البواب/مصرة المثانة) لتسهيل التفريغ والاطراح." },
            { id: 30, sec: "القسم 6: التأثيرات الجهازية", accent: "rose",
              q: "يتسبب النيكوتين لدى المدخنين في ارتفاع الضغط الدموي عبر مسارين هما:",
              options: ["أ) تحفيز $N_n$ الكظري لإفراز الأدرينالين، وتنشيط $N_n$ الدماغي لزيادة إفراز هرمون $ADH$", "ب) حصر المستقبلات الموسكارينية $M_2$ و $M_3$", "ج) تثبيط إفراز الكولين والنورأدرينالين", "د) كل ما سبق خطأ"],
              correct: 0,
              exp: "يرفع النيكوتين الضغط عبر: 1. المسار الكظري الوعائي (تحفيز $N_n$ الكظر لإفراز الأدرينالين القابض للأوعية)، 2. المسار العصبي الهرموني (تحفيز $N_n$ بالدماغ لزيادة إفراز الهرمون المضاد لإدرار البول $ADH$)." }
        ];

        // Accent color mapping for Tailwind classes
        const accentMap = {
            purple:  { border: "border-r-4 border-r-violet-500", badge: "bg-violet-100 text-violet-800", icon: "text-violet-600" },
            cyan:    { border: "border-r-4 border-r-cyan-500",   badge: "bg-cyan-100 text-cyan-800",     icon: "text-cyan-600" },
            emerald: { border: "border-r-4 border-r-emerald-500",badge: "bg-emerald-100 text-emerald-800",icon: "text-emerald-600" },
            amber:   { border: "border-r-4 border-r-amber-500",  badge: "bg-amber-100 text-amber-800",   icon: "text-amber-600" },
            rose:    { border: "border-r-4 border-r-rose-500",   badge: "bg-rose-100 text-rose-800",     icon: "text-rose-600" }
        };

        let currentFlashcardFilter = "الكل";
        let currentQuizFilter = "الكل";
        let userQuizAnswers = {};

        // Render KaTeX safely
        function renderMathSafe(element) {
            if (window.renderMathInElement) {
                try {
                    renderMathInElement(element, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                } catch (e) {}
            }
        }

        // Switch between Flashcards and Quiz tabs
        function switchTab(tabName) {
            const fcView = document.getElementById('view-flashcards');
            const qzView = document.getElementById('view-quiz');

            if (tabName === 'flashcards') {
                fcView.classList.remove('hidden');
                qzView.classList.add('hidden');
            } else {
                qzView.classList.remove('hidden');
                fcView.classList.add('hidden');
            }

            // Update all tab buttons (both header and bottom nav)
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isTarget = btn.getAttribute('data-tab') === tabName;
                if (isTarget) {
                    btn.className = btn.className
                        .replace(/bg-slate-100|text-slate-600|bg-transparent/g, '')
                        + ' bg-violet-600 text-white shadow-sm';
                } else {
                    btn.className = btn.className
                        .replace(/bg-violet-600|text-white|shadow-md|shadow-sm|shadow-violet-500\/20/g, '')
                        + ' bg-slate-100 text-slate-600';
                }
            });

            if (window.tgHaptic) window.tgHaptic.impact('light');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // FLASHCARDS LOGIC
        // ==========================================
        function initFlashcards() {
            const categories = ["الكل", ...new Set(flashcardsData.map(f => f.cat))];
            const filterContainer = document.getElementById('flashcard-filters');

            filterContainer.innerHTML = categories.map(cat => {
                const active = cat === currentFlashcardFilter;
                return `
                    <button onclick="filterFlashcards('${cat.replace(/'/g, "\\'")}')"
                        class="shrink-0 px-3.5 py-2 rounded-xl font-heading font-bold text-xs transition-all active:scale-95 ${
                            active
                                ? 'bg-cyan-600 text-white shadow-sm'
                                : 'bg-white text-slate-600 border border-slate-200 hover:border-cyan-400'
                        }">
                        ${cat}
                    </button>
                `;
            }).join('');

            renderFlashcards();
        }

        function filterFlashcards(cat) {
            currentFlashcardFilter = cat;
            if (window.tgHaptic) window.tgHaptic.impact('light');
            initFlashcards();
        }

        function renderFlashcards() {
            const container = document.getElementById('flashcards-container');
            const filtered = currentFlashcardFilter === "الكل"
                ? flashcardsData
                : flashcardsData.filter(f => f.cat === currentFlashcardFilter);

            document.getElementById('fc-count-badge').textContent = filtered.length;

            container.innerHTML = filtered.map(card => {
                const theme = accentMap[card.accent] || accentMap.purple;
                return `
                    <div onclick="toggleSingleCard(this)" class="flashcard-card open cursor-pointer bg-white rounded-2xl p-4 border border-slate-200 ${theme.border} shadow-sm hover:shadow-md transition-all select-none">
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-heading font-bold ${theme.badge}">
                                بطاقة #${card.id} • ${card.cat}
                            </span>
                            <span class="text-slate-400 text-xs flex items-center gap-1">
                                <span class="text-[11px]">الجواب</span>
                                <i class="fa-solid fa-chevron-down chevron-icon transition-transform duration-200"></i>
                            </span>
                        </div>

                        <div class="font-heading font-bold text-sm sm:text-base text-slate-900 flex items-start gap-2.5 leading-relaxed">
                            <i class="fa-solid ${card.icon} ${theme.icon} mt-1 shrink-0"></i>
                            <span>${card.q}</span>
                        </div>

                        <div class="flashcard-answer mt-3.5 pt-3 border-t border-dashed border-slate-200 space-y-2">
                            <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-3">
                                <div class="font-heading font-bold text-xs text-emerald-800 flex items-center gap-1.5 mb-1">
                                    <i class="fa-solid fa-circle-check text-emerald-600"></i>
                                    <span>الإجابة النموذجية</span>
                                </div>
                                <div class="text-xs sm:text-sm text-slate-800 leading-relaxed">${card.a}</div>
                            </div>

                            <div class="bg-amber-50/70 border border-amber-200/80 rounded-xl p-3">
                                <div class="font-heading font-bold text-xs text-amber-800 flex items-center gap-1.5 mb-1">
                                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                                    <span>التعليل الفارماكولوجي</span>
                                </div>
                                <div class="text-xs text-slate-700 leading-relaxed">${card.exp}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderMathSafe(container);
        }

        function toggleSingleCard(cardEl) {
            cardEl.classList.toggle('open');
            if (window.tgHaptic) window.tgHaptic.impact('light');
        }

        function toggleAllFlashcards(openState) {
            document.querySelectorAll('.flashcard-card').forEach(el => {
                if (openState) el.classList.add('open');
                else el.classList.remove('open');
            });
            if (window.tgHaptic) window.tgHaptic.impact('medium');
        }

        // ==========================================
        // QUIZ LOGIC
        // ==========================================
        function initQuiz() {
            const sections = ["الكل", ...new Set(quizData.map(q => q.sec))];
            const filterContainer = document.getElementById('quiz-filters');

            filterContainer.innerHTML = sections.map(sec => {
                const active = sec === currentQuizFilter;
                return `
                    <button onclick="filterQuiz('${sec.replace(/'/g, "\\'")}')"
                        class="shrink-0 px-3.5 py-2 rounded-xl font-heading font-bold text-xs transition-all active:scale-95 ${
                            active
                                ? 'bg-violet-600 text-white shadow-sm'
                                : 'bg-white text-slate-600 border border-slate-200 hover:border-violet-400'
                        }">
                        ${sec}
                    </button>
                `;
            }).join('');

            renderQuiz();
        }

        function filterQuiz(sec) {
            currentQuizFilter = sec;
            if (window.tgHaptic) window.tgHaptic.impact('light');
            initQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const filtered = currentQuizFilter === "الكل"
                ? quizData
                : quizData.filter(q => q.sec === currentQuizFilter);

            container.innerHTML = filtered.map(item => {
                const theme = accentMap[item.accent] || accentMap.purple;
                const answeredIdx = userQuizAnswers[item.id];
                const isAnswered = answeredIdx !== undefined;

                const optionsHTML = item.options.map((opt, idx) => {
                    let btnStyle = "bg-slate-50 hover:bg-violet-50/70 border-slate-200 text-slate-800";
                    let iconHTML = `<i class="fa-regular fa-circle text-slate-400 shrink-0"></i>`;

                    if (isAnswered) {
                        if (idx === item.correct) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                            iconHTML = `<i class="fa-solid fa-circle-check text-emerald-600 shrink-0"></i>`;
                        } else if (idx === answeredIdx && answeredIdx !== item.correct) {
                            btnStyle = "bg-rose-50 border-rose-500 text-rose-900";
                            iconHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 shrink-0"></i>`;
                        } else {
                            btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-75";
                        }
                    }

                    return `
                        <button ${isAnswered ? 'disabled' : ''}
                            onclick="selectQuizOption(${item.id}, ${idx})"
                            class="w-full text-right p-3 rounded-xl border text-xs sm:text-sm transition-all flex items-center gap-2.5 active:scale-[0.99] ${btnStyle}">
                            ${iconHTML}
                            <span class="leading-relaxed">${opt}</span>
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 ${theme.border} shadow-sm">
                        <div class="flex items-center justify-between gap-2 mb-2.5 flex-wrap">
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-heading font-bold ${theme.badge}">
                                السؤال ${item.id} من 30 • ${item.sec}
                            </span>
                            ${isAnswered
                                ? (answeredIdx === item.correct
                                    ? `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-heading font-bold bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check ml-1"></i>إجابة صحيحة</span>`
                                    : `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-heading font-bold bg-rose-100 text-rose-800"><i class="fa-solid fa-xmark ml-1"></i>إجابة خاطئة</span>`)
                                : ''}
                        </div>

                        <div class="font-heading font-bold text-sm sm:text-base text-slate-900 mb-3 leading-relaxed">
                            ${item.q}
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${optionsHTML}
                        </div>

                        ${isAnswered ? `
                            <div class="mt-3 bg-emerald-50/80 border border-emerald-200 rounded-xl p-3">
                                <div class="font-heading font-bold text-xs text-emerald-800 flex items-center gap-1.5 mb-1">
                                    <i class="fa-solid fa-award text-emerald-600"></i>
                                    <span>الشرح والتعليل الفارماكولوجي:</span>
                                </div>
                                <p class="text-xs text-slate-700 leading-relaxed">${item.exp}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            renderMathSafe(container);
            updateQuizScore();
        }

        function selectQuizOption(questionId, optionIndex) {
            userQuizAnswers[questionId] = optionIndex;
            renderQuiz();

            if (window.tgHaptic) {
                const q = quizData.find(item => item.id === questionId);
                if (q && optionIndex === q.correct) {
                    window.tgHaptic.success();
                } else {
                    window.tgHaptic.error();
                }
            }
        }

        function revealAllQuizAnswers() {
            quizData.forEach(q => {
                if (userQuizAnswers[q.id] === undefined) {
                    userQuizAnswers[q.id] = q.correct;
                }
            });
            if (window.tgHaptic) window.tgHaptic.impact('medium');
            renderQuiz();
        }

        function resetQuiz() {
            userQuizAnswers = {};
            if (window.tgHaptic) window.tgHaptic.impact('medium');
            renderQuiz();
        }

        function updateQuizScore() {
            const answeredIds = Object.keys(userQuizAnswers);
            const totalAnswered = answeredIds.length;
            let correctCount = 0;

            answeredIds.forEach(id => {
                const q = quizData.find(item => item.id === parseInt(id));
                if (q && userQuizAnswers[id] === q.correct) {
                    correctCount++;
                }
            });

            const percent = totalAnswered > 0 ? Math.round((correctCount / 30) * 100) : 0;

            document.getElementById('quiz-answered').textContent = `${totalAnswered} / 30`;
            document.getElementById('quiz-correct').textContent = correctCount;
            document.getElementById('quiz-percent').textContent = `${percent}%`;
        }

        // ==========================================
        // TELEGRAM MINI APP & MOBILE INTEGRATION
        // ==========================================
        function initTelegramMiniApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                const safeCall = (fn) => { try { return fn(); } catch (e) { return undefined; } };

                safeCall(() => tg.ready());
                safeCall(() => tg.expand());
                safeCall(() => tg.setHeaderColor('#FFFFFF'));
                safeCall(() => tg.setBackgroundColor('#F8FAFC'));

                // Display Telegram user name if opened inside Telegram Mini App
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    const badge = document.getElementById('tg-user-badge');
                    if (badge && user.first_name) {
                        badge.textContent = `مرحباً ${user.first_name} • تيليجرام ميني آب`;
                    }
                }

                window.tgHaptic = {
                    success: () => safeCall(() => tg.HapticFeedback.notificationOccurred('success')),
                    error:   () => safeCall(() => tg.HapticFeedback.notificationOccurred('error')),
                    impact:  (lvl) => safeCall(() => tg.HapticFeedback.impactOccurred(lvl || 'light'))
                };
            } else {
                window.tgHaptic = { success: () => {}, error: () => {}, impact: () => {} };
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initFlashcards();
            initQuiz();
            initTelegramMiniApp();
            renderMathSafe(document.body);
        });

        window.addEventListener('load', () => {
            renderMathSafe(document.body);
        });
    </script>
</body>
</html>
